<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Culture · Erdo · HRS #25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: talk show santai tapi tajam; satu pembicara, Erdo.
   IDEA: ikut poster acara: biru royal, gelombang, judul amber huruf besar, ribbon Learning Fest.
   PICTURE: tanaman yang terus tumbuh vs pot yang mandek; angka hook raksasa; foto komunitas sebagai pop-up.
   COLOUR and TYPE: biru #1f2f9e, navy #141f6e, amber #f7a823, putih, abu muda #eceef4; Poppins + Inter.
   LAYOUT: unit --u dari viewport. Landscape = 16:9; .port (HP/portrait dan mirror di HP peserta) = ditumpuk. */
:root{--blue:#1f2f9e;--navy:#141f6e;--amber:#f7a823;--gold:#ffc23d;--coral:#f26b3a;--sky:#8fa2ff;--mint:#5fd3c4;
--white:#fff;--mist:#eceef4;--ink:#10173f;--mute:#5a6290;--hd:Poppins,system-ui,sans-serif;--bd:Inter,system-ui,sans-serif;
--u:min(calc(100vw / 1600),calc(100vh / 900));color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:16px/1.5 var(--bd);background:var(--blue);color:var(--white);overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
img{display:block;max-width:100%}
.hidden{display:none!important}

/* ---------- SLIDES ---------- */
#host{position:fixed;inset:0;background:var(--blue)}
.slide{position:absolute;inset:0;padding:calc(var(--u)*70) calc(var(--u)*96) calc(var(--u)*110);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:hidden;background:var(--blue);color:var(--white)}
.slide.on{opacity:1;pointer-events:auto}
.slide>*{position:relative;z-index:1}
.slide>.waves{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.slide.mist{background:var(--mist);color:var(--ink)}
.slide.amber{background:var(--amber);color:var(--ink)}
.kick{font:600 calc(var(--u)*20)/1.2 var(--hd);color:var(--amber);margin-bottom:calc(var(--u)*20);display:flex;align-items:center;gap:calc(var(--u)*12)}
.kick:before{content:"";width:calc(var(--u)*40);height:calc(var(--u)*4);background:currentColor;border-radius:4px}
.mist .kick{color:var(--blue)}.amber .kick{color:var(--navy)}
h1,h2,h3{font-family:var(--hd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:calc(var(--u)*80);line-height:1.02;font-weight:800;text-transform:uppercase;color:var(--amber)}
h2{font-size:calc(var(--u)*56);line-height:1.08;font-weight:700}
h3{font-size:calc(var(--u)*30);line-height:1.2;font-weight:700}
.lead{font-size:calc(var(--u)*26);line-height:1.45;max-width:calc(var(--u)*1100)}
.small{font-size:calc(var(--u)*17)}
.soft{opacity:.8}
.hl{color:var(--amber)}
.chrome{position:fixed;left:calc(var(--u)*96);right:calc(var(--u)*96);bottom:calc(var(--u)*28);display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*16);z-index:5;pointer-events:none}
.chrome>span{background:rgba(16,23,63,.85);color:#fff;padding:calc(var(--u)*8) calc(var(--u)*16);border-radius:99px;display:inline-flex;gap:calc(var(--u)*10);align-items:center;font-weight:600}
.prog{position:fixed;left:0;bottom:0;height:calc(var(--u)*7);background:var(--amber);transition:width .4s;z-index:5}
.dot{width:10px;height:10px;border-radius:50%;background:#999}
.dot.live{background:var(--mint);animation:pulse 1.8s infinite}.dot.err{background:var(--coral)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,196,.7)}70%{box-shadow:0 0 0 10px rgba(95,211,196,0)}}
.step{opacity:0;transform:translateY(calc(var(--u)*30));transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.step.shown{opacity:1;transform:none}

/* QR */
.qrw{background:#fff;padding:calc(var(--u)*12);border-radius:calc(var(--u)*14);flex:none}
.qrw canvas{display:block;width:var(--q,calc(var(--u)*200));height:var(--q,calc(var(--u)*200))}
.url{font:700 calc(var(--u)*26)/1.25 var(--hd);color:var(--amber);word-break:break-all}

/* cover */
.ribbon{position:absolute!important;z-index:2!important;top:calc(var(--u)*70);right:calc(var(--u)*-150);transform:rotate(38deg);background:#c9ccd8;color:var(--blue);font:800 calc(var(--u)*34)/1 var(--hd);padding:calc(var(--u)*16) calc(var(--u)*170);white-space:nowrap}
.ribbon span{color:var(--amber)}
.cover{display:grid;grid-template-columns:1.3fr .7fr;gap:calc(var(--u)*30);height:100%}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:calc(var(--u)*16);font:800 calc(var(--u)*38)/1 var(--hd)}
.brand .tag{font:700 calc(var(--u)*17) var(--hd);background:var(--amber);color:var(--navy);padding:calc(var(--u)*6) calc(var(--u)*14);border-radius:99px}
.cover h1{margin:calc(var(--u)*22) 0 calc(var(--u)*12)}
.sub{font:500 calc(var(--u)*28)/1.2 var(--hd);padding-bottom:calc(var(--u)*12);border-bottom:calc(var(--u)*3) solid #fff;align-self:flex-start}
.meta{display:grid;grid-template-columns:auto auto;gap:calc(var(--u)*10) calc(var(--u)*50);margin-top:calc(var(--u)*22);align-self:flex-start}
.meta b{display:block;font:700 calc(var(--u)*30)/1.15 var(--hd);color:var(--amber)}
.meta span{font-size:calc(var(--u)*19);line-height:1.35;display:block}
.cside{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);justify-content:center;padding-top:calc(var(--u)*90)}
.cside .qrw{--q:calc(var(--u)*320)}
.scan{text-align:center}
.scan b{display:block;font:700 calc(var(--u)*24)/1.2 var(--hd)}
.plants{width:100%;height:100%}
.stem{transform-origin:bottom center;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
.pop{transform-box:fill-box;transform-origin:left bottom;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}

/* polls */
.pollgrid{display:grid;grid-template-columns:1fr calc(var(--u)*340);gap:calc(var(--u)*40);flex:1;min-height:0}
.pollq{font:700 calc(var(--u)*50)/1.12 var(--hd);text-wrap:balance}
.bars{margin-top:calc(var(--u)*30);display:flex;flex-direction:column;gap:calc(var(--u)*14)}
.bar{display:grid;grid-template-columns:calc(var(--u)*56) 1fr calc(var(--u)*120);align-items:center;gap:calc(var(--u)*16);font-size:calc(var(--u)*26)}
.bar .k{width:calc(var(--u)*52);height:calc(var(--u)*52);border-radius:calc(var(--u)*14);display:grid;place-items:center;font:700 calc(var(--u)*24) var(--hd);background:var(--c);color:var(--ink)}
.track{position:relative;height:calc(var(--u)*60);border-radius:calc(var(--u)*16);background:rgba(255,255,255,.12);overflow:hidden}
.mist .track{background:rgba(31,47,158,.08)}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);border-radius:calc(var(--u)*16);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lbl{position:absolute;left:calc(var(--u)*12);top:50%;transform:translateY(-50%);max-width:calc(100% - var(--u)*24);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink);background:rgba(255,255,255,.92);padding:calc(var(--u)*4) calc(var(--u)*14);border-radius:99px}
.bar.top .lbl{font-weight:800}
.pct{text-align:right;font:700 calc(var(--u)*32) var(--hd)}
.pct small{display:block;font:500 calc(var(--u)*15) var(--bd);opacity:.7}
.manual .bar,.manual .col{cursor:pointer}.manual .track{outline:2px dashed var(--amber)}
.pollside{display:flex;flex-direction:column;gap:calc(var(--u)*12);align-items:center;text-align:center}
.pollside .qrw{--q:calc(var(--u)*300)}
.count{font:800 calc(var(--u)*96)/1 var(--hd);color:var(--amber)}
.mist .count{color:var(--blue)}.amber .count{color:var(--navy)}
.reveal{position:absolute!important;left:calc(var(--u)*96);right:calc(var(--u)*96);bottom:calc(var(--u)*96);background:#fff;color:var(--ink);border-radius:calc(var(--u)*28);padding:calc(var(--u)*24) calc(var(--u)*40);box-shadow:0 24px 70px rgba(0,0,0,.45);z-index:4!important;display:grid;grid-template-columns:auto 1fr;column-gap:calc(var(--u)*40);align-items:center;border-left:calc(var(--u)*16) solid var(--amber)}
.reveal b{display:block;font:800 calc(var(--u)*140)/1 var(--hd);color:var(--blue);grid-row:span 2}
.reveal q{font:600 calc(var(--u)*32)/1.3 var(--hd);quotes:"\201C" "\201D"}
.reveal cite{display:block;margin-top:calc(var(--u)*12);font:500 calc(var(--u)*17)/1.4 var(--bd);font-style:normal;color:var(--mute)}
.reveal cite b{display:inline;font:700 calc(var(--u)*17) var(--bd);color:var(--ink)}
.scaleWrap{display:flex;gap:calc(var(--u)*24);align-items:flex-end;height:calc(var(--u)*340);margin-top:calc(var(--u)*20)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10);height:100%;justify-content:flex-end}
.colbar{width:100%;border-radius:calc(var(--u)*18) calc(var(--u)*18) 6px 6px;background:var(--c);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col b{font:700 calc(var(--u)*34) var(--hd)}.col span{font:700 calc(var(--u)*28) var(--hd)}
.avgbox{display:flex;align-items:baseline;gap:calc(var(--u)*16);margin-top:calc(var(--u)*16)}
.avg{font:800 calc(var(--u)*100)/1 var(--hd);color:var(--amber)}
.ends{display:flex;justify-content:space-between;gap:20px;font-size:calc(var(--u)*20);margin-top:calc(var(--u)*12)}
.wall{flex:1;display:flex;flex-wrap:wrap;gap:calc(var(--u)*14);align-content:flex-start;margin-top:calc(var(--u)*30);overflow:hidden}
.chip{padding:calc(var(--u)*14) calc(var(--u)*24);border-radius:99px;font:600 calc(var(--u)*25)/1.2 var(--hd);animation:pop .5s both;max-width:100%;background:var(--c);color:var(--ink)}

/* trivia */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*24);margin-top:calc(var(--u)*36);align-items:start}
.fact{border-radius:calc(var(--u)*26);padding:calc(var(--u)*32);background:var(--c);color:var(--ink);display:flex;flex-direction:column;gap:calc(var(--u)*12)}
.fact .tagx{font:700 calc(var(--u)*16) var(--hd);text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.fact b{font:800 calc(var(--u)*96)/1 var(--hd)}
.fact .what{margin:0;font:600 calc(var(--u)*23)/1.35 var(--hd)}
.fact blockquote{margin:calc(var(--u)*8) 0 0;padding:calc(var(--u)*16) 0 0;border-top:2px solid rgba(16,23,63,.18);font:500 calc(var(--u)*19)/1.45 var(--bd);font-style:italic}
.fact cite{font:600 calc(var(--u)*15)/1.4 var(--bd);font-style:normal;opacity:.8}

/* about */
.tline{display:grid;grid-template-columns:1fr 1.15fr 1fr 1fr 2.1fr 1fr;gap:calc(var(--u)*18);margin-top:calc(var(--u)*30);align-items:start}
.node{display:flex;flex-direction:column;gap:calc(var(--u)*10)}
.logos{display:flex;gap:calc(var(--u)*8);height:calc(var(--u)*92)}
.lg{background:#fff;border-radius:calc(var(--u)*14);padding:calc(var(--u)*10);display:grid;place-items:center;flex:1}
.lg img{max-height:calc(var(--u)*70);width:auto;object-fit:contain}
.node b{font:700 calc(var(--u)*22)/1.2 var(--hd)}
.node span{font-size:calc(var(--u)*17);line-height:1.35;opacity:.85}
.ladder{display:flex;flex-direction:column;gap:calc(var(--u)*6);margin-top:calc(var(--u)*4)}
.rung{display:flex;align-items:center;gap:calc(var(--u)*10);font:600 calc(var(--u)*17)/1.2 var(--hd);background:rgba(255,255,255,.12);border-radius:calc(var(--u)*10);padding:calc(var(--u)*8) calc(var(--u)*12);margin-left:calc(var(--u)*var(--i)*22)}
.rung i{font-style:normal;width:calc(var(--u)*26);height:calc(var(--u)*26);border-radius:50%;background:var(--amber);color:var(--navy);display:grid;place-items:center;font-size:calc(var(--u)*14);flex:none}
.rung:last-child{background:var(--amber);color:var(--navy)}
.rung:last-child i{background:var(--navy);color:var(--amber)}
.comm{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*24);margin-top:auto}
.cbox{border-radius:calc(var(--u)*24);padding:calc(var(--u)*22) calc(var(--u)*28);display:flex;gap:calc(var(--u)*22);align-items:center;color:var(--ink);background:#fff}
.cbox .clogo{width:calc(var(--u)*150);flex:none}
.cbox .big{font:800 calc(var(--u)*84)/1 var(--hd);flex:none;color:var(--blue)}
.cbox>div:last-child{flex:1}
.cbox .yr{font:700 calc(var(--u)*17) var(--hd);display:inline-block;padding:calc(var(--u)*4) calc(var(--u)*12);border-radius:99px;background:var(--amber);margin-bottom:calc(var(--u)*6)}
.cbox p{margin:0;font-size:calc(var(--u)*19);line-height:1.35}
.polaroid{position:absolute!important;z-index:4!important;background:#fff;padding:calc(var(--u)*14) calc(var(--u)*14) calc(var(--u)*10);border-radius:calc(var(--u)*10);box-shadow:0 30px 80px rgba(0,0,0,.5);color:var(--ink)}
.polaroid img{width:100%;border-radius:calc(var(--u)*6)}
.polaroid figcaption{font:700 calc(var(--u)*20)/1.3 var(--hd);padding-top:calc(var(--u)*10)}
.polaroid figcaption span{display:block;font:500 calc(var(--u)*15) var(--bd);color:var(--mute)}
.pol1{left:calc(var(--u)*170);top:calc(var(--u)*200);width:calc(var(--u)*760);rotate:-3deg}
.pol2{right:calc(var(--u)*150);top:calc(var(--u)*110);width:calc(var(--u)*460);rotate:4deg}
.step.polaroid{transform:translateY(calc(var(--u)*30)) scale(.92)}.step.polaroid.shown{transform:none}

/* tigaraksa + growth */
.tgk{display:grid;grid-template-columns:1.1fr .9fr;gap:calc(var(--u)*44);margin-top:calc(var(--u)*28);flex:1;min-height:0}
.tgk>div:first-child{display:flex;flex-direction:column}
.metric{margin-bottom:calc(var(--u)*20)}
.metric h4{margin:0 0 calc(var(--u)*8);font:600 calc(var(--u)*21) var(--hd)}
.yb{display:grid;grid-template-columns:calc(var(--u)*70) 1fr calc(var(--u)*170);gap:calc(var(--u)*14);align-items:center;margin:calc(var(--u)*6) 0;font-size:calc(var(--u)*19)}
.yb i{display:block;height:calc(var(--u)*28);border-radius:calc(var(--u)*8);background:var(--c);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.on .yb i{width:var(--w)}
.yb em{font-style:normal;font-weight:700;text-align:right;white-space:nowrap}
.src{margin-top:auto;padding-top:calc(var(--u)*14);font-size:calc(var(--u)*15);opacity:.7}
.dose{background:var(--blue);color:#fff;border-radius:calc(var(--u)*28);padding:calc(var(--u)*36);display:flex;flex-direction:column;gap:calc(var(--u)*18);align-self:start}
.dose .q{font:800 calc(var(--u)*44)/1.12 var(--hd)}
.dose ul{margin:0;padding:0;list-style:none;font-size:calc(var(--u)*22);line-height:1.4}
.dose li{padding:calc(var(--u)*12) 0;border-top:1px solid rgba(255,255,255,.2)}
.dose li b{color:var(--amber)}
.grow2{display:grid;grid-template-columns:1.3fr 1fr;gap:calc(var(--u)*32);margin-top:calc(var(--u)*34);flex:1;min-height:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*18)}
.card{border-radius:calc(var(--u)*22);padding:calc(var(--u)*26);background:#fff;color:var(--ink);display:flex;flex-direction:column;gap:calc(var(--u)*10);border-top:calc(var(--u)*8) solid var(--c)}
.card h3{font-size:calc(var(--u)*26)}
.card p{margin:0;font-size:calc(var(--u)*19);line-height:1.4;color:var(--mute)}
.ritual{background:var(--amber);color:var(--ink);border-radius:calc(var(--u)*26);padding:calc(var(--u)*32);display:flex;flex-direction:column;gap:calc(var(--u)*12)}
.ritual h3{font-size:calc(var(--u)*34)}
.ritual ol{margin:0;padding-left:calc(var(--u)*28);font-size:calc(var(--u)*22);line-height:1.45}
.ritual .roles{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*14);font-size:calc(var(--u)*18);line-height:1.35}
.ritual .roles div{background:rgba(255,255,255,.55);border-radius:calc(var(--u)*14);padding:calc(var(--u)*14)}

/* closing */
.closing{display:grid;grid-template-columns:1fr calc(var(--u)*500);gap:calc(var(--u)*40);flex:1;min-height:0}
.closing>div:first-child{display:flex;flex-direction:column;gap:calc(var(--u)*20)}
.quote{font:800 calc(var(--u)*54)/1.1 var(--hd);text-wrap:balance}
.joins{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*20);margin-top:auto}
.jcard{background:#fff;color:var(--ink);border-radius:calc(var(--u)*22);padding:calc(var(--u)*20);display:flex;gap:calc(var(--u)*18);align-items:center}
.jcard .qrw{padding:0;--q:calc(var(--u)*170)}
.jcard b{display:block;font:700 calc(var(--u)*22)/1.2 var(--hd)}
.jcard .lk{font:700 calc(var(--u)*20) var(--hd);color:var(--blue);white-space:nowrap}
.jcard p{margin:calc(var(--u)*6) 0 0;font-size:calc(var(--u)*16);line-height:1.35;color:var(--mute)}
.jlogos{display:flex;gap:calc(var(--u)*10);align-items:center;margin:calc(var(--u)*8) 0}
.jlogos img{height:calc(var(--u)*30);width:auto}
.qlist{display:flex;flex-direction:column;gap:calc(var(--u)*12);overflow:hidden}
.qhead{font:700 calc(var(--u)*24) var(--hd);color:var(--amber)}
.qi{display:grid;grid-template-columns:calc(var(--u)*70) 1fr calc(var(--u)*40);gap:calc(var(--u)*14);align-items:center;background:#fff;border-radius:calc(var(--u)*18);padding:calc(var(--u)*14) calc(var(--u)*18);color:var(--ink);border-left:calc(var(--u)*10) solid var(--c)}
.qi .v{font:800 calc(var(--u)*32) var(--hd);text-align:center;color:var(--blue)}
.qi .v small{display:block;font:500 calc(var(--u)*13) var(--bd);color:var(--mute)}
.qi p{margin:0;font-size:calc(var(--u)*21);line-height:1.35}
.qi button{border:0;background:transparent;font-size:calc(var(--u)*24);color:#a33;opacity:.4}
.qi.pin{outline:calc(var(--u)*4) solid var(--amber)}

/* ---------- STACKED LAYOUT (.port: HP/portrait host + mirror di HP peserta) ---------- */
#host.port{--u:calc(100vw / 760)}
.port .slide{overflow-y:auto;padding:calc(var(--u)*56) calc(var(--u)*40) calc(var(--u)*150)}
.port h1{font-size:calc(var(--u)*64)}
.port .ribbon{font-size:calc(var(--u)*22);top:calc(var(--u)*24)}
.port .cover,.port .pollgrid,.port .tgk,.port .comm,.port .grow2,.port .closing,.port .joins{grid-template-columns:1fr}
.port .cover{height:auto}
.port .cside{flex-direction:row;justify-content:center}
.port .cside{padding-top:calc(var(--u)*30)}
.port .pollgrid,.port .tgk,.port .grow2,.port .closing,.port .facts,.port .cards,.port .comm{flex:none;align-content:start}
.port .facts{grid-template-columns:1fr}
.port .tline{grid-template-columns:1fr 1fr}
.port .tline .node.wide{grid-column:1 / -1}
.port .comm{margin-top:calc(var(--u)*30)}
.port .polaroid{position:relative!important;left:auto;right:auto;top:auto;width:auto;rotate:0deg;margin-top:calc(var(--u)*24)}
.port .pollside{flex-direction:row;justify-content:space-between;order:-1}
.port .pollside .qrw{--q:calc(var(--u)*200)}
.port .pollq{font-size:calc(var(--u)*44)}
.port .bar{grid-template-columns:calc(var(--u)*52) 1fr calc(var(--u)*110)}
.port .lbl{white-space:normal;line-height:1.15;border-radius:calc(var(--u)*12)}.port .track{height:calc(var(--u)*80)}
.port .reveal{position:relative!important;left:auto;right:auto;bottom:auto;margin-top:calc(var(--u)*24);grid-template-columns:1fr}
.port .reveal b{grid-row:auto}
.port .qlist{margin-top:calc(var(--u)*20)}
#host.port .chrome{left:calc(var(--u)*24);right:calc(var(--u)*24)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,16,50,.92);display:grid;place-items:center;z-index:20;padding:16px}
.qrbig{background:#fff;color:var(--ink);border-radius:28px;padding:32px;text-align:center;max-width:92vw;border-top:14px solid var(--amber)}
.qrbig h2{font-size:clamp(24px,4vw,44px);margin-bottom:16px}

/* ============ SHARED TALLY ENGINE ============ */
function Engine(getRoot, opts={}){
  const V = {}; PID.forEach(p=>V[p]={});
  const E = { Q:{}, U:{}, M:{}, R:{}, hid:new Set(), pin:null };
  E.ingest = (d,t) => {
    if (!d || typeof d!=='object' || typeof d.id!=='string') return false;
    if ((d.k==='v'||d.k==='w') && V[d.p]) { const prev=V[d.p][d.id]; if(!prev||prev.t<=t) V[d.p][d.id] = {a: d.k==='w'? String(d.a).slice(0,60) : +d.a, t}; return true; }
    if (d.k==='q' && typeof d.qid==='string') { E.Q[d.qid] = {t:String(d.t).slice(0,220), time:t}; return true; }
    if (d.k==='u' && typeof d.qid==='string') { (E.U[d.qid] ||= new Set()); d.on===false ? E.U[d.qid].delete(d.id) : E.U[d.qid].add(d.id); return true; }
    return false;
  };
  E.tally = p => {
    const P = POLLS[p], n = P.opts ? P.opts.length : 0, c = new Array(n).fill(0), list = [];
    for (const v of Object.values(V[p])) { if (v.t < (E.R[p]||0)) continue; if (P.type==='text') list.push(v); else if (v.a>=0 && v.a<n) c[v.a]++; }
    (E.M[p]||[]).forEach((m,i)=>{ if(i<n) c[i]+=m||0; });
    return {c, list, total: P.type==='text' ? list.length : c.reduce((a,b)=>a+b,0)};
  };
  E.questions = () => Object.entries(E.Q).filter(([id])=>!E.hid.has(id)).map(([id,q])=>({id,...q,n:(E.U[id]?E.U[id].size:0)})).sort((a,b)=>b.n-a.n||a.time-b.time);
  function renderPoll(root,p){
    const {c,list,total} = E.tally(p), max = Math.max(...c, 0);
    root.querySelectorAll(`[data-count="${p}"]`).forEach(e=>e.textContent=total);
    root.querySelectorAll(`[data-bars="${p}"] .bar`).forEach(b=>{const i=+b.dataset.i, pc= total? Math.round(c[i]/total*100):0;
      b.querySelector('.fill').style.width = pc+'%'; b.querySelector('.pct').innerHTML = `${pc}%<small>${c[i]} orang</small>`; b.classList.toggle('top', max>0 && c[i]===max);});
    root.querySelectorAll(`[data-scale="${p}"] .col`).forEach(b=>{const i=+b.dataset.i; b.querySelector('.colbar').style.height = (max? c[i]/max*75:0)+'%'; b.querySelector('b').textContent=c[i];});
    root.querySelectorAll(`[data-avg="${p}"]`).forEach(e=>{const s=c.reduce((a,v,i)=>a+v*(i+1),0); e.textContent = total ? (s/total).toFixed(1).replace('.',',') : '–';});
    root.querySelectorAll(`[data-wall="${p}"]`).forEach(w=>{ const items = list.sort((a,b)=>b.t-a.t).slice(0,40);
      const key = items.map(x=>x.t+x.a).join('|'); if (w.dataset.key===key) return; w.dataset.key=key; w.innerHTML='';
      items.forEach((x,i)=>{const d=document.createElement('div');d.className='chip';d.style.setProperty('--c',['#ffffff','#1f2f9e','#f26b3a','#5fd3c4','#8fa2ff'][i%5]);if(i%5===1)d.style.color='#fff';d.textContent=x.a;w.appendChild(d)}); });
  }
  function renderQA(root){
    root.querySelectorAll('[data-qlist]').forEach(el=>{
      const qs = E.questions().slice(0,5);
      el.querySelectorAll('.qi,.qempty').forEach(x=>x.remove());
      if (!qs.length){ const d=document.createElement('div'); d.className='lead soft qempty'; d.textContent='Belum ada pertanyaan. Kirim dari HP kamu.'; el.appendChild(d); }
      qs.forEach((q,i)=>{const d=document.createElement('div');d.className='qi'+(E.pin===q.id?' pin':'');d.style.setProperty('--c',['#f7a823','#8fa2ff','#f26b3a','#5fd3c4'][i%4]);
        d.innerHTML=`<div class="v">${q.n}<small>vote</small></div><p></p>${opts.moderate?'<button title="Sembunyikan" aria-label="Sembunyikan">×</button>':'<span></span>'}`;
        d.querySelector('p').textContent=q.t;
        if (opts.moderate){ d.onclick=()=>opts.onPin(q.id); d.querySelector('button').onclick=e=>{e.stopPropagation();opts.onHide(q.id);}; }
        el.appendChild(d);});
    });
  }
  let raf=0;
  E.render = () => { if(raf) return; raf=requestAnimationFrame(()=>{raf=0; const root=getRoot(); if(!root) return; PID.forEach(p=>renderPoll(root,p)); renderQA(root);}); };
  return E;
}
function subscribe(topic, since, onMsg, onOpen, onErr){
  try { const es = new EventSource(RELAY + topic + '/sse?since=' + since);
    es.onopen = ()=>onOpen&&onOpen(); es.onerror = ()=>onErr&&onErr();
    es.onmessage = e => { try { const m=JSON.parse(e.data); if (m.event!=='message') return; onMsg(JSON.parse(m.message), m.time); } catch(x){} };
  } catch(e){ onErr&&onErr(); }
}

/* ============ HOST ============ */
function host(){
  const root = document.getElementById('host'); root.classList.remove('hidden');
  const mq = matchMedia('(orientation:portrait),(max-width:700px)');
  const setPort = ()=>root.classList.toggle('port', mq.matches); setPort(); mq.addEventListener?.('change', setPort);
  let idx = Math.min(ls.get('hrs25-idx',0), S.length-1), stepN = 0, manual = false, showNotes = false;
  const E = Engine(()=>root, {moderate:true, onPin:id=>{E.pin = E.pin===id?null:id; E.render(); publish();}, onHide:id=>{E.hid.add(id); ls.set('hrs25-hiddenq',[...E.hid]); E.render(); publish();}});
  E.M = ls.get('hrs25-manual', {}); E.R = ls.get('hrs25-reset', {}); E.hid = new Set(ls.get('hrs25-hiddenq', []));

  root.innerHTML = S.map((s,i)=>slideHTML(i)).join('') +
    `<div class="chrome"><span><span class="dot" id="cdot"></span><span id="ctext">Menghubungkan…</span></span><span id="cpage"></span></div><div class="prog" id="prog"></div>`;
  hydrate(root);
  const slides = [...root.querySelectorAll('.slide')];

  function setConn(s){ const dot=document.getElementById('cdot'), t=document.getElementById('ctext');
    dot.className='dot '+(s==='live'?'live':s==='err'?'err':''); t.textContent = s==='live' ? 'Live voting aktif' : s==='err' ? 'Offline · tally manual (M)' : 'Menghubungkan…'; }
  subscribe(TV, 'all', (d,t)=>{ if(E.ingest(d,t)) E.render(); }, ()=>setConn('live'), ()=>setConn('err'));

  let pubT=0;
  function publish(){ clearTimeout(pubT); pubT=setTimeout(()=>{ const s=S[idx];
    post(TS, {slide:idx, step:stepN, poll:s.poll||null, R:E.R, M:E.M, hid:[...E.hid].slice(-50), pin:E.pin}).catch(()=>{}); },400); }

  const stepsOf = i => [...slides[i].querySelectorAll('.step')];
  function showSteps(){ stepsOf(idx).forEach((el,j)=>el.classList.toggle('shown', j<stepN)); }
  function go(i, atEnd){
    idx = Math.max(0, Math.min(S.length-1, i)); ls.set('hrs25-idx', idx);
    stepN = atEnd ? stepsOf(idx).length : 0;
    slides.forEach((el,j)=>{ el.classList.toggle('on', j===idx); if(j===idx) el.scrollTop=0; });
    showSteps();
    document.getElementById('prog').style.width = ((idx+1)/S.length*100)+'%';
    document.getElementById('cpage').textContent = `${idx+1} / ${S.length}`;
    root.classList.toggle('manual', manual);
    renderNotes(); E.render(); publish();
  }
  function next(){ if (stepN < stepsOf(idx).length){ stepN++; showSteps(); publish(); } else go(idx+1); }
  function prev(){ if (stepN > 0){ stepN--; showSteps(); publish(); } else go(idx-1, true); }

  const notesEl = document.createElement('div'); notesEl.id='notes'; notesEl.className='hidden'; document.body.appendChild(notesEl);
  function renderNotes(){ notesEl.classList.toggle('hidden', !showNotes); notesEl.innerHTML = `<div class="soft" style="font-size:12px;margin-bottom:6px">Catatan pembicara · slide ${idx+1}</div>` + (S[idx].notes||'Tidak ada catatan.'); }
  const help = document.createElement('div'); help.id='help';
  help.innerHTML = `<kbd>→</kbd> <kbd>←</kbd> pindah / munculkan · <kbd>N</kbd> catatan · <kbd>Q</kbd> QR besar · <kbd>F</kbd> layar penuh<br><kbd>M</kbd> tally manual (klik opsi +1, Shift+klik −1) · <kbd>R</kbd> reset polling · <kbd>S</kbd> setelan · <kbd>H</kbd> bantuan`;
  document.body.appendChild(help); setTimeout(()=>help.classList.add('hidden'),12000);

  function overlay(html, onMount){ const o=document.createElement('div'); o.className='ov'; o.innerHTML=html; o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); onMount&&onMount(o); return o; }
  function bigQR(){ overlay(`<div class="qrbig"><h2>Scan untuk ikut voting</h2><div data-qr="700" data-qrv="join"></div><div class="url"></div></div>`, o=>{ qrInto(o.querySelector('[data-qr]')); o.querySelector('.url').textContent=shortLabel(); }); }
  function settings(){ overlay(`<form class="set"><h3 style="font-size:24px">Setelan</h3>
    <label for="ju">URL lengkap untuk audiens (yang masuk ke QR)</label><input id="ju" type="url" placeholder="https://…">
    <label for="sl">Link pendek yang tampil di slide</label><input id="sl" type="text" placeholder="${esc(SHORT_LINK)}">
    <div class="soft" style="font-size:13px">Kosongkan untuk memakai nilai bawaan. Room relay: ${esc(ROOM)}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn alt" id="rs">Reset semua polling</button><button class="btn">Simpan</button></div></form>`, o=>{
      const f=o.querySelector('form'), ju=o.querySelector('#ju'), sl=o.querySelector('#sl'); ju.value=ls.get('hrs25-join',''); sl.value=ls.get('hrs25-short','');
      f.onsubmit=e=>{e.preventDefault(); ls.set('hrs25-join', ju.value.trim()); ls.set('hrs25-short', sl.value.trim()); location.reload();};
      o.querySelector('#rs').onclick=()=>{ const now=Date.now()/1000; PID.forEach(p=>{E.R[p]=now;E.M[p]=[]}); ls.set('hrs25-reset',E.R); ls.set('hrs25-manual',E.M); toast('Semua polling di-reset'); o.remove(); E.render(); publish(); };
    }); }
  function confirmReset(p){ overlay(`<div class="set"><h3 style="font-size:22px">Reset polling ini?</h3><div>Jawaban sebelumnya diabaikan, audiens bisa vote ulang.</div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn alt" id="no">Batal</button><button class="btn" id="yes">Reset</button></div></div>`, o=>{
    o.querySelector('#no').onclick=()=>o.remove(); o.querySelector('#yes').onclick=()=>{E.R[p]=Date.now()/1000; E.M[p]=[]; ls.set('hrs25-reset',E.R); ls.set('hrs25-manual',E.M); o.remove(); E.render(); publish(); toast('Polling di-reset');}; }); }

  root.addEventListener('click', e=>{
    const b = e.target.closest('.bar,.col'); if (!manual || !b) return;
    const p = S[idx].poll; if(!p) return; const i=+b.dataset.i; E.M[p] ||= []; E.M[p][i] = Math.max(0,(E.M[p][i]||0) + (e.shiftKey?-1:1)); ls.set('hrs25-manual',E.M); E.render(); publish();
  });
  document.addEventListener('keydown', e=>{
    if (e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (['arrowright','pagedown',' ','enter'].includes(k)) { e.preventDefault(); next(); }
    else if (['arrowleft','pageup','backspace'].includes(k)) { e.preventDefault(); prev(); }
    else if (k==='home') go(0); else if (k==='end') go(S.length-1);
    else if (k==='n') { showNotes=!showNotes; renderNotes(); }
    else if (k==='h') help.classList.toggle('hidden');
    else if (k==='m') { manual=!manual; root.classList.toggle('manual',manual); toast(manual?'Tally manual ON: klik opsi untuk +1':'Tally manual OFF'); }
    else if (k==='r' && S[idx].poll) confirmReset(S[idx].poll);
    else if (k==='q') { const o=document.querySelector('.ov'); o?o.remove():bigQR(); }
    else if (k==='s') settings();
    else if (k==='escape') document.querySelector('.ov')?.remove();
    else if (k==='f') { try{ document.fullscreenElement? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(x){} }
  });
  let tx=0, ty=0; root.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  root.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) (dx<0?next:prev)();});
  setConn('off'); go(idx);
  setInterval(publish, 180000); /* re-announce tiap 3 menit, hemat kuota relay */
}

/* ============ AUDIENCE ============ */
function audience(){
  const root = document.getElementById('aud'); root.classList.remove('hidden'); root.classList.add('port');
  let me = ls.get('hrs25-me',''); if(!me){ me = Math.random().toString(36).slice(2)+Date.now().toString(36); ls.set('hrs25-me',me); }
  const mine = ls.get('hrs25-mine',{}), myUps = new Set(ls.get('hrs25-ups',[]));
  let st = null, shownSlide = -1, tab='live', busy=false, ok='';
  root.innerHTML = `<div class="atop"><span class="abrand">hrstories <span>#25</span> · Learning Culture</span><span id="ast">Menghubungkan…</span></div>
    <div class="tabs"><button data-t="live" class="on">Live</button><button data-t="qa">Tanya</button></div>
    <div id="vote"></div><div id="qa" class="hidden"></div><div id="live"><div class="livetag">● Slide di layar</div><div class="mirror" id="mirror"></div></div>`;
  const $ = id => document.getElementById(id);
  const E = Engine(()=>$('mirror'));
  root.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; ok=''; root.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); drawTab();});

  function drawTab(){ $('live').classList.toggle('hidden', tab!=='live'); $('vote').classList.toggle('hidden', tab!=='live'); $('qa').classList.toggle('hidden', tab!=='qa'); if(tab==='qa') drawQA(); else drawVote(); }
  function drawMirror(){
    const m = $('mirror');
    if (!st){ m.innerHTML = `<div class="acard wait" style="margin:0 16px"><svg viewBox="0 0 120 120"><rect x="56" y="40" width="8" height="50" rx="4" fill="#5fd3c4"/><path d="M60 60 C70 44 92 44 98 54 C86 62 70 64 60 60Z" fill="#5fd3c4"/><path d="M60 72 C50 56 28 56 22 66 C34 74 50 76 60 72Z" fill="#8fa2ff"/><circle cx="60" cy="34" r="10" fill="#f7a823"/><path d="M34 90h52l-6 26H40z" fill="#f7a823"/></svg><h2>Sebentar lagi mulai</h2><p style="color:var(--mute)">Slide dari layar akan muncul di sini otomatis.</p></div>`; return; }
    if (shownSlide !== st.slide){ shownSlide = st.slide; m.innerHTML = slideHTML(st.slide); hydrate(m); requestAnimationFrame(()=>m.querySelector('.slide')?.classList.add('on')); }
    [...m.querySelectorAll('.step')].forEach((el,j)=>el.classList.toggle('shown', j < (st.step||0)));
    E.render();
  }
  async function send(body){
    if (busy) return; busy=true; drawTab();
    try { const r = await post(TV, body); if(!r.ok) throw 0; ok='Tercatat. Hasilnya muncul di layar dan di bawah.'; E.ingest(body, Date.now()/1000); E.render(); }
    catch(e){ ok='Gagal terkirim, coba lagi sebentar.'; }
    setTimeout(()=>{busy=false; drawTab();}, 1200); drawTab();
  }
  function drawVote(){
    const b = $('vote'); const p = st && st.poll, P = POLLS[p];
    if (!P) { b.innerHTML=''; return; }
    let html = `<div class="acard"><div class="hint">Vote sekarang</div><h2></h2>`;
    if (P.type==='choice') html += P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" style="--c:${C[i]}" ${busy?'disabled':''}><span class="k">${L[i]}</span><span></span></button>`).join('');
    else if (P.type==='scale') html += `<div class="scl">${P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" ${busy?'disabled':''}>${o}</button>`).join('')}</div><div class="ends2"><span>1 = ${esc(P.lo)}</span><span style="text-align:right">5 = ${esc(P.hi)}</span></div>`;
    else html += `<input class="ainput" id="wt" maxlength="60" placeholder="Contoh: retro 30 menit tiap Jumat"><button class="abtn" id="ws" ${busy?'disabled':''}>Kirim</button>`;
    html += `<div class="ok">${esc(ok)}</div></div>`;
    const keepVal = b.querySelector('#wt')?.value;
    b.innerHTML = html; b.querySelector('h2').textContent = P.q;
    if (P.opts) b.querySelectorAll('.opt').forEach(o=>{ const i=+o.dataset.i; if(P.type==='choice') o.querySelector('span:last-child').textContent=P.opts[i];
      o.onclick=()=>{ mine[p]=i; ls.set('hrs25-mine',mine); send({k:'v',p,a:i,id:me}); }; });
    else { const inp=b.querySelector('#wt'); inp.value = keepVal ?? (mine[p]||''); b.querySelector('#ws').onclick=()=>{ const v=inp.value.trim(); if(!v) return; mine[p]=v; ls.set('hrs25-mine',mine); send({k:'w',p,a:v,id:me}); }; }
  }
  function drawQA(){
    const b = $('qa'); const draft = b.querySelector('#qt')?.value || '';
    const qs = E.questions().sort((a,b)=>b.n-a.n||b.time-a.time).slice(0,30);
    b.innerHTML = `<div class="acard"><h2>Mau tanya apa?</h2><textarea class="ainput" id="qt" rows="3" maxlength="220" placeholder="Tulis pertanyaanmu…"></textarea><button class="abtn" id="qs" ${busy?'disabled':''}>Kirim pertanyaan</button><div class="ok">${esc(ok)}</div></div>
      <div class="acard"><h2 style="font-size:18px">Vote pertanyaan yang kamu mau dibahas</h2><div id="ql">${qs.length?'':'<p style="color:var(--mute)">Belum ada pertanyaan.</p>'}</div></div>`;
    b.querySelector('#qt').value = draft;
    const ql = b.querySelector('#ql');
    qs.forEach(q=>{ const d=document.createElement('div'); d.className='aq'; d.innerHTML=`<p></p><button class="up ${myUps.has(q.id)?'on':''}">+${q.n}</button>`; d.querySelector('p').textContent=q.t;
      d.querySelector('button').onclick=()=>{ const on=!myUps.has(q.id); on?myUps.add(q.id):myUps.delete(q.id); ls.set('hrs25-ups',[...myUps]);
        E.ingest({k:'u',qid:q.id,on,id:me}, Date.now()/1000); post(TV,{k:'u',qid:q.id,on,id:me}).catch(()=>{}); drawQA(); };
      ql.appendChild(d); });
    b.querySelector('#qs').onclick=()=>{ const t=b.querySelector('#qt').value.trim(); if(!t) return; const qid=Math.random().toString(36).slice(2,10); b.querySelector('#qt').value=''; send({k:'q',qid,t,id:me}); };
  }
  const stEl = $('ast');
  subscribe(TS, '30m', d=>{
    if (!d || typeof d.slide!=='number' || !S[d.slide]) return;
    const pollChanged = !st || st.poll !== (d.poll||null);
    E.R = d.R||{}; E.M = d.M||{}; E.hid = new Set(Array.isArray(d.hid)?d.hid:[]); E.pin = d.pin||null;
    st = {slide:d.slide, step:+d.step||0, poll:POLLS[d.poll]?d.poll:null};
    if (pollChanged) ok='';
    drawMirror(); if (tab==='live' && (pollChanged || !document.querySelector('#wt:focus'))) drawVote();
  }, ()=>stEl.textContent='Terhubung', ()=>stEl.textContent='Menyambung ulang…');
  subscribe(TV, 'all', (d,t)=>{ if(!E.ingest(d,t)) return; E.render(); if(tab==='qa' && document.activeElement?.id!=='qt' && (d.k==='q'||d.k==='u')) drawQA(); });
  drawMirror(); drawTab();
}

(location.hash === '#host') ? host() : audience();
addEventListener('hashchange', ()=>location.reload());
}
</script>
