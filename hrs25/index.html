<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Culture · HRS #25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: warm, practical, talk-show energy; casual Indonesian like Erdo talks.
   IDEA: a nursery bench — two pots, one keeps growing, one stalls. Every poll is a plant bed.
   PICTURE: SVG pots and growing leaves on the cover; poll bars grow like stems.
   COLOUR and TYPE: deep forest green field, paper white, sun yellow accent; Familjen Grotesk + Inter.
   LAYOUT: fixed 16:9 stage scaled to the screen for the host; one calm column on the phone for the audience. */
:root{--g:#0d3a2b;--g2:#15563f;--leaf:#3fb27c;--leaf2:#8fd9a8;--sun:#f5c542;--paper:#f7f6f0;--ink:#10241b;--mute:#5d6f66;
--hd:"Familjen Grotesk",system-ui,sans-serif;--bd:Inter,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:16px/1.5 var(--bd);background:var(--g);color:var(--paper);overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hidden{display:none!important}

/* ---------- HOST ---------- */
#host{position:fixed;inset:0;display:grid;place-items:center;background:#08261c}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;overflow:hidden;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.slide{position:absolute;inset:0;padding:80px 96px 110px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease}
.slide.on{opacity:1;pointer-events:auto}
.slide.dark{background:var(--g);color:var(--paper)}
.slide.light{background:var(--paper);color:var(--ink)}
.slide.sun{background:var(--sun);color:var(--ink)}
.seg{font:600 20px/1 var(--bd);color:var(--leaf2);margin-bottom:28px}
.light .seg,.sun .seg{color:var(--g2)}
h1,h2,h3{font-family:var(--hd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:96px;line-height:1}
h2{font-size:64px;line-height:1.05}
h3{font-size:34px;line-height:1.15}
.lead{font-size:30px;line-height:1.4;max-width:1100px}
.mute{color:var(--mute)}.dark .mute{color:#a8c7b8}
.row{display:flex;gap:40px}
.grow{flex:1}
.chrome{position:absolute;left:96px;right:96px;bottom:30px;display:flex;justify-content:space-between;align-items:center;font-size:17px;opacity:.85;z-index:2}
.prog{position:absolute;left:0;bottom:0;height:6px;background:var(--sun);transition:width .4s}
.chrome .pill,#cpage{background:rgba(8,38,28,.82);color:#f7f6f0;padding:8px 16px;border-radius:99px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.12);font-weight:600}
.light .pill:not(.chrome *),.sun .pill:not(.chrome *){background:rgba(13,58,43,.09)}
.dot{width:12px;height:12px;border-radius:50%;background:#999}
.dot.live{background:var(--leaf);box-shadow:0 0 0 0 var(--leaf);animation:pulse 1.8s infinite}
.dot.err{background:#e5684f}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(63,178,124,0)}100%{box-shadow:0 0 0 0 rgba(63,178,124,0)}}

/* cover */
.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;height:100%}
.cover h1{font-size:88px;margin:18px 0 26px}
.speakers{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin-top:auto;font-size:21px}
.speakers b{display:block;font:700 26px/1.2 var(--hd);color:var(--paper)}
.joinbox{display:flex;gap:26px;align-items:center;background:var(--paper);color:var(--ink);border-radius:22px;padding:22px;margin-top:30px}
.joinbox canvas,.qrbig canvas{display:block;border-radius:10px;background:#fff}
.joinbox b{font:700 30px/1.1 var(--hd)}
.url{font:600 20px/1.3 var(--bd);word-break:break-all;color:var(--g2)}
.plants{width:100%;height:100%}
.stem{transform-origin:bottom center;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
.leafg{transform-box:fill-box;transform-origin:left bottom;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}

/* poll */
.pollq{font:700 60px/1.06 var(--hd);max-width:1250px;text-wrap:balance}
.bars{margin-top:44px;display:flex;flex-direction:column;gap:18px;flex:1}
.bar{position:relative;display:grid;grid-template-columns:60px 1fr 150px;align-items:center;gap:20px;font-size:28px;cursor:default}
.bar .k{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 26px var(--hd);background:rgba(13,58,43,.1)}
.dark .bar .k{background:rgba(255,255,255,.12)}
.track{position:relative;height:64px;border-radius:16px;background:rgba(13,58,43,.07);overflow:hidden}
.dark .track{background:rgba(255,255,255,.08)}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(63,178,124,.5);border-radius:16px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.top .fill{background:var(--sun)}
.dark .bar.top .fill{background:var(--sun)}
.lbl{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;right:16px}
.pct{text-align:right;font:700 34px var(--hd)}
.pct small{display:block;font:500 17px var(--bd);opacity:.65}
.manual .bar{cursor:pointer}
.manual .bar:hover .track{outline:3px dashed var(--sun)}
.pollside{width:340px;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.count{font:700 120px/1 var(--hd)}
.qrsmall canvas{width:220px;height:220px}
.scaleWrap{display:flex;gap:26px;align-items:flex-end;height:400px;margin-top:40px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;height:100%;justify-content:flex-end}
.colbar{width:100%;border-radius:18px 18px 6px 6px;background:var(--leaf);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col.top .colbar{background:var(--g2)}
.col b{font:700 40px var(--hd)}
.avg{font:700 150px/1 var(--hd)}
.ends{display:flex;justify-content:space-between;font-size:22px;margin-top:14px}
.wall{flex:1;display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start;margin-top:40px;overflow:hidden}
.chip{padding:14px 24px;border-radius:99px;background:var(--g2);color:var(--paper);font:500 26px/1.2 var(--bd);animation:pop .5s both;max-width:100%}
.chip:nth-child(3n){background:var(--leaf);color:var(--ink)}
.chip:nth-child(5n){background:var(--sun);color:var(--ink)}

/* content blocks */
.split{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:44px;flex:1}
.panel{border-radius:26px;padding:40px 44px}
.panel h3{margin-bottom:22px}
.panel ul{margin:0;padding:0;list-style:none;font-size:27px;line-height:1.35}
.panel li{padding:14px 0;border-top:1px solid rgba(13,58,43,.14)}
.p-grey{background:#e7e5dc;color:#5c6460}
.p-green{background:var(--g);color:var(--paper)}
.p-green li{border-color:rgba(255,255,255,.16)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:50px;flex:1}
.card{border-radius:24px;padding:34px 30px;background:#fff;color:var(--ink);display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 0 rgba(13,58,43,.08)}
.dark .card{background:var(--g2);color:var(--paper)}
.card .n{width:56px;height:56px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font:700 26px var(--hd)}
.card h3{font-size:31px}
.card p{margin:0;font-size:22px;line-height:1.4;opacity:.85}
.timeline{display:flex;gap:0;margin-top:60px;position:relative}
.timeline:before{content:"";position:absolute;left:0;right:0;top:19px;height:4px;background:var(--leaf);border-radius:4px}
.tl{flex:1;position:relative;padding-top:58px;padding-right:18px}
.tl:before{content:"";position:absolute;top:6px;left:0;width:30px;height:30px;border-radius:50%;background:var(--paper);border:6px solid var(--leaf)}
.tl.now:before{background:var(--sun);border-color:var(--sun)}
.tl b{display:block;font:700 26px/1.15 var(--hd)}
.tl span{font-size:19px;line-height:1.35;display:block;margin-top:8px;opacity:.8}
.big{font:700 128px/1 var(--hd);color:var(--sun)}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:46px;flex:1}
.beat{border-left:6px solid var(--leaf);padding:6px 0 6px 28px}
.beat small{font:600 20px var(--bd);color:var(--g2)}
.dark .beat small{color:var(--leaf2)}
.beat p{font-size:28px;line-height:1.4;margin:10px 0 0}
.beat p.todo{opacity:.45;font-style:italic}
.quote{font:700 78px/1.08 var(--hd);max-width:1300px;text-wrap:balance}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:40px;flex:1}
.roles ul{margin:0;padding:0;list-style:none;font-size:24px;line-height:1.4}
.roles li{margin:8px 0}
.qa{display:grid;grid-template-columns:1fr 360px;gap:40px;flex:1;margin-top:34px;min-height:0}
.qlist{display:flex;flex-direction:column;gap:14px;overflow:hidden}
.qi{display:grid;grid-template-columns:84px 1fr 44px;gap:18px;align-items:center;background:#fff;border-radius:20px;padding:18px 22px;color:var(--ink)}
.qi .v{font:700 36px var(--hd);text-align:center;color:var(--g2)}
.qi .v small{display:block;font:500 14px var(--bd);color:var(--mute)}
.qi p{margin:0;font-size:25px;line-height:1.35}
.qi button{border:0;background:transparent;font-size:26px;color:#a33;opacity:.4}
.qi button:hover{opacity:1}
.qi.pin{outline:4px solid var(--sun)}
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:40px;flex:1}
.rc{background:var(--g2);border-radius:22px;padding:26px 28px;display:flex;flex-direction:column;gap:10px}
.rc small{font-size:18px;color:var(--leaf2)}
.rc b{font:700 30px/1.15 var(--hd)}
.rc span{font-size:19px;opacity:.75}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,25,18,.92);display:grid;place-items:center;z-index:20}
.qrbig{background:var(--paper);color:var(--ink);border-radius:28px;padding:40px;text-align:center;max-width:90vw}
.qrbig h2{font-size:44px;margin-bottom:20px}
#notes{position:fixed;right:16px;bottom:16px;width:min(520px,44vw);max-height:60vh;overflow:auto;background:#fffbe8;color:#2a2a1f;border-radius:16px;padding:20px 24px;z-index:15;font-size:16px;line-height:1.5;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#notes h4{margin:0 0 8px;font:700 18px var(--hd)}
#notes ul{padding-left:20px;margin:6px 0}
#help{position:fixed;right:16px;top:16px;z-index:15;background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.7}
#help kbd{background:#fff;color:#000;border-radius:4px;padding:0 6px;font:600 12px var(--bd)}
.set{background:var(--paper);color:var(--ink);border-radius:20px;padding:30px;width:min(620px,92vw);display:flex;flex-direction:column;gap:14px}
.set label{font-weight:600}
.set input{font:16px var(--bd);padding:12px;border-radius:10px;border:1px solid #bbb;width:100%}
.btn{border:0;border-radius:12px;padding:12px 20px;min-height:44px;background:var(--g);color:var(--paper);font-weight:600}
.btn.alt{background:#ddd;color:#222}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);padding:10px 20px;border-radius:99px;font-weight:600;z-index:30}

/* ---------- AUDIENCE (phone) ---------- */
#aud{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:18px 18px 40px}
.atop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#a8c7b8}
.abrand{font:700 20px var(--hd);color:var(--paper)}
.acard{background:var(--paper);color:var(--ink);border-radius:24px;padding:24px 20px;margin-top:18px}
.acard h2{font-size:27px;line-height:1.15;margin-bottom:18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid #d9dcd3;background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin-top:10px;min-height:56px;font-size:16px;transition:transform .15s}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:#eef0ea;display:grid;place-items:center;font:700 16px var(--hd)}
.opt.sel{border-color:var(--g2);background:#e6f5ec}
.opt.sel .k{background:var(--g2);color:#fff}
.scl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scl .opt{justify-content:center;font:700 22px var(--hd);padding:0}
.ends2{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:8px;gap:12px}
.ainput{width:100%;font:16px var(--bd);padding:14px;border-radius:14px;border:2px solid #d9dcd3;resize:vertical}
.abtn{margin-top:12px;width:100%;border:0;border-radius:14px;background:var(--g);color:var(--paper);font-weight:600;min-height:52px;font-size:16px}
.abtn:disabled{opacity:.5}
.ok{margin-top:14px;font-size:14px;color:var(--g2);font-weight:600;min-height:20px}
.wait{text-align:center;padding:30px 10px}
.wait svg{width:120px;height:120px}
.aq{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #e3e5dd}
.aq p{margin:0;flex:1;font-size:15px}
.up{flex:none;border:2px solid #d9dcd3;background:#fff;border-radius:12px;min-width:56px;min-height:44px;font-weight:700;color:var(--g2)}
.up.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.tabs{display:flex;gap:8px;margin-top:18px}
.tabs button{flex:1;min-height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:var(--paper);font-weight:600}
.tabs button.on{background:var(--sun);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="host" class="hidden"><div id="stage"></div></div>
<div id="aud" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
{
/* ============ CONFIG — ganti di sini kalau perlu ============ */
const ROOM = new URLSearchParams(location.search).get('room') || 'hrs25-learningculture-odid-7k3q';
const RELAY = 'https://ntfy.sh/';
const TV = ROOM + '-v', TS = ROOM + '-s';

/* Cerita dari past company — isi bagian ini (tampil di slide Cerita 1 & 2) */
const STORIES = {
  s1: { title: 'Cerita dari past company #1', where: 'Tulis nama perusahaan & konteksnya',
        beats: ['Situasinya: program training apa yang ramai saat itu?',
                'Yang terjadi: apa yang (tidak) berubah di pekerjaan sehari-hari?',
                'Pelajarannya: apa yang kamu sadari soal aktivitas vs budaya belajar?'], todo: true },
  s2: { title: 'Cerita dari past company #2', where: 'Tulis nama perusahaan & konteksnya',
        beats: ['Leader-nya ngapain? (perilaku konkret, bukan slogan)',
                'Ritual belajarnya seperti apa? (retro, sharing, coaching)',
                'Apa yang bikin kebiasaan itu bertahan?'], todo: true }
};

const POLLS = {
  p1:{type:'choice',q:'3 bulan terakhir, kamu paling banyak belajar dari…',opts:['Training / kelas formal','Atasan atau rekan kerja','Ngerjain tugas baru yang menantang','Konten online: YouTube, podcast, AI','Jujur, belum ada yang nempel']},
  p2:{type:'choice',q:'Di kantormu, training itu lebih mirip…',opts:['Vitamin: rutin, efeknya nggak kerasa','Obat: baru dikasih pas ada masalah','Hadiah: buat yang berprestasi','Kewajiban: ikut biar absen aman','Nutrisi: bagian dari kerja harian']},
  p3:{type:'choice',q:'Gejala "jalan di tempat" yang paling sering kamu lihat',opts:['Habis training, balik ke cara lama','Yang ikut training itu-itu aja','Nggak ada yang berani bilang "belum bisa"','Sharing session sepi atau formalitas','Budget belajar nggak terserap']},
  p4:{type:'scale',q:'Seberapa aman di timmu bilang "saya belum bisa"?',opts:['1','2','3','4','5'],lo:'Bisa jadi bahan omongan',hi:'Biasa aja, malah dibantu'},
  p5:{type:'choice',q:'Waktu belajar di timmu…',opts:['Ada, dan dilindungi di kalender','Ada, tapi selalu kalah sama target','Disuruh belajar di luar jam kerja','Belum ada sama sekali']},
  p6:{type:'choice',q:'Retro atau sharing session di timmu…',opts:['Rutin, dan ada aksi lanjutannya','Rutin, tapi jadi formalitas','Pernah ada, lalu hilang','Belum pernah ada']},
  p7:{type:'text',q:'Satu langkah kecil yang mau kamu mulai minggu depan?'}
};
const PID = Object.keys(POLLS);
const L = 'ABCDEFGH';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const post = body => fetch(RELAY + TV, {method:'POST', body: JSON.stringify(body)});
const toast = (t) => {const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)};

function joinUrl(){
  const saved = ls.get('hrs25-join', '');
  if (saved) return saved;
  if (/^https?:$/.test(location.protocol)) return location.origin + location.pathname + location.search;
  return 'Atur URL di menu S';
}
function qr(el, size){
  const u = joinUrl();
  if (window.QRious && /^https?:/.test(u)) { const c=document.createElement('canvas'); new QRious({element:c,value:u,size:size,foreground:'#0d3a2b',level:'M'}); el.appendChild(c); }
}

const PLANTS = `<svg class="plants" viewBox="0 0 600 720" aria-label="Dua pot tanaman: satu terus tumbuh, satu jalan di tempat">
  <defs><linearGradient id="pot" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5c542"/><stop offset="1" stop-color="#d9a72a"/></linearGradient>
  <g id="lf"><path d="M0 0 C 30 -40, 90 -40, 110 -10 C 80 10, 30 15, 0 0Z" fill="#3fb27c"/><path d="M0 0 C 40 -18, 80 -18, 110 -10" stroke="#8fd9a8" stroke-width="3" fill="none"/></g></defs>
  <ellipse cx="300" cy="690" rx="290" ry="18" fill="#08261c"/>
  <g class="stem"><rect x="176" y="150" width="12" height="450" rx="6" fill="#3fb27c"/></g>
  ${[0,1,2,3,4,5].map(i=>{const y=560-i*75,r=i%2;return `<g transform="translate(${r?188:176} ${y}) scale(${r?1:-1} 1)"><g class="leafg" style="animation-delay:${.5+i*.28}s"><use href="#lf"/></g></g>`}).join('')}
  <circle cx="182" cy="140" r="16" fill="#f5c542" class="leafg" style="animation-delay:2.3s"/>
  <path d="M100 590 h164 l-18 96 h-128z" fill="url(#pot)"/><rect x="92" y="578" width="180" height="26" rx="8" fill="#f5c542"/>
  <rect x="418" y="540" width="10" height="50" rx="5" fill="#6d8f7f"/>
  <g transform="translate(428 552) rotate(25)"><path d="M0 0 C 14 -16, 40 -16, 48 -4 C 34 6, 14 6, 0 0Z" fill="#6d8f7f"/></g>
  <path d="M340 590 h164 l-18 96 h-128z" fill="#b9b7ad"/><rect x="332" y="578" width="180" height="26" rx="8" fill="#d4d2c8"/>
  <text x="182" y="716" text-anchor="middle" font-family="Inter" font-size="22" font-weight="600" fill="#8fd9a8">terus tumbuh</text>
  <text x="422" y="716" text-anchor="middle" font-family="Inter" font-size="22" font-weight="600" fill="#a8c7b8">jalan di tempat</text>
</svg>`;

/* ============ SLIDES ============ */
const S = [
 {cls:'dark',seg:'',html:()=>`<div class="cover"><div style="display:flex;flex-direction:column">
   <div class="seg">HR Stories Meetup #25 × Circle HR ITB · Kamis, 26 November 2026</div>
   <h1>Learning Culture: why some teams keep growing and others stall</h1>
   <div class="speakers"><div><b>Erdo Deshiant Garnaby</b>OD & Culture Practitioner · Founder OD.ID & Circle HR ITB</div>
   <div><b>Sapto Ashardianto</b>HC Division Head, Hasnur Group</div><div><b>Khalid Nurf</b>Host · Founder & CEO HR Stories</div></div>

/* ============ HOST ============ */
function host(){
  document.getElementById('host').classList.remove('hidden');
  const stage = document.getElementById('stage');
  let idx = Math.min(ls.get('hrs25-idx',0), S.length-1), manual = false, showNotes = false, showHelp = true, conn = 'off';
  const V = {}; PID.forEach(p=>V[p]={});           // V[p][voter] = {a,t}
  const M = ls.get('hrs25-manual', {});             // M[p][i] = count
  const R = ls.get('hrs25-reset', {});              // R[p] = unix sec
  const hiddenQ = new Set(ls.get('hrs25-hiddenq', []));
  let pinQ = null; const Q = {}, U = {};           // Q[qid]={t,time}; U[qid]=Set(voter)

  stage.innerHTML = S.map((s,i)=>`<section class="slide ${s.cls}" id="s${i}">${s.seg?`<div class="seg">${esc(s.seg)}</div>`:''}${body(s)}</section>`).join('') +
    `<div class="chrome"><span class="pill"><span class="dot" id="cdot"></span><span id="ctext">Menghubungkan…</span></span><span id="cpage"></span></div><div class="prog" id="prog"></div>`;
  stage.querySelectorAll('[data-qr]').forEach(el=>qr(el,+el.dataset.qr));
  stage.querySelectorAll('[data-url]').forEach(el=>el.textContent=joinUrl().replace(/^https?:\/\//,''));

  function body(s){
    if (s.html) return s.html();
    if (s.story){ const st=STORIES[s.story]; return `<h2>${esc(st.title)}</h2><div class="lead mute" style="margin-top:14px">${esc(st.where)}</div>
      <div class="story">${['Situasi','Momen','Pelajaran'].map((h,i)=>`<div class="beat"><small>${h}</small><p class="${st.todo?'todo':''}">${esc(st.beats[i]||'')}</p></div>`).join('')}</div>`; }
    if (s.qa) return `<h2>Pertanyaan dari kamu</h2><div class="qa"><div class="qlist" id="qlist"></div><div class="pollside"><div class="qrsmall" data-qr="220"></div><div class="lead" style="font-size:22px">Kirim pertanyaan lewat HP, lalu vote pertanyaan orang lain</div></div></div>`;
    if (s.recap) return `<h2>Yang kita pelajari malam ini, dari jawaban kalian</h2><div class="recap" id="recap"></div>`;
    const P = POLLS[s.poll];
    let inner;
    if (P.type==='choice') inner = `<div class="bars" data-bars="${s.poll}">${P.opts.map((o,i)=>`<div class="bar" data-i="${i}"><div class="k">${L[i]}</div><div class="track"><div class="fill"></div><div class="lbl">${esc(o)}</div></div><div class="pct">0%<small>0</small></div></div>`).join('')}</div>`;
    else if (P.type==='scale') inner = `<div class="row" style="flex:1;align-items:flex-end"><div style="width:320px"><div class="avg" data-avg="${s.poll}">–</div><div class="lead mute" style="font-size:24px">rata-rata dari 5</div></div>
      <div class="grow"><div class="scaleWrap" data-scale="${s.poll}">${P.opts.map((o,i)=>`<div class="col" data-i="${i}"><b>0</b><div class="colbar"></div><div style="font:700 30px var(--hd)">${o}</div></div>`).join('')}</div><div class="ends"><span>1 = ${esc(P.lo)}</span><span>5 = ${esc(P.hi)}</span></div></div></div>`;
    else inner = `<div class="wall" data-wall="${s.poll}"></div>`;
    return `<div class="row" style="flex:1;min-height:0"><div class="grow" style="display:flex;flex-direction:column;min-height:0"><div class="pollq">${esc(P.q)}</div>${inner}</div>
      <div class="pollside"><div class="qrsmall" data-qr="220"></div><div class="count" data-count="${s.poll}">0</div><div class="mute" style="font-size:22px">jawaban masuk</div></div></div>`;
  }

  function tally(p){
    const P = POLLS[p], n = P.opts ? P.opts.length : 0, c = new Array(n).fill(0); let list = [];
    for (const v of Object.values(V[p])) { if (v.t < (R[p]||0)) continue; if (P.type==='text') list.push(v); else if (v.a>=0 && v.a<n) c[v.a]++; }
    (M[p]||[]).forEach((m,i)=>{ if(i<n) c[i]+=m; });
    return {c, list, total: P.type==='text' ? list.length : c.reduce((a,b)=>a+b,0)};
  }
  function renderPoll(p){
    const P = POLLS[p], {c,list,total} = tally(p);
    stage.querySelectorAll(`[data-count="${p}"]`).forEach(e=>e.textContent=total);
    const max = Math.max(...c, 0);
    stage.querySelectorAll(`[data-bars="${p}"] .bar`).forEach(b=>{const i=+b.dataset.i, pc= total? Math.round(c[i]/total*100):0;
      b.querySelector('.fill').style.width = pc+'%'; b.querySelector('.pct').innerHTML = `${pc}%<small>${c[i]} orang</small>`; b.classList.toggle('top', max>0 && c[i]===max);});
    stage.querySelectorAll(`[data-scale="${p}"] .col`).forEach(b=>{const i=+b.dataset.i; b.querySelector('.colbar').style.height = (max? c[i]/max*300:0)+'px'; b.querySelector('b').textContent=c[i]; b.classList.toggle('top', max>0&&c[i]===max);});
    stage.querySelectorAll(`[data-avg="${p}"]`).forEach(e=>{const s=c.reduce((a,v,i)=>a+v*(i+1),0); e.textContent = total ? (s/total).toFixed(1).replace('.',',') : '–';});
    stage.querySelectorAll(`[data-wall="${p}"]`).forEach(w=>{ const items = list.sort((a,b)=>b.t-a.t).slice(0,40);
      const key = items.map(x=>x.t+x.a).join('|'); if (w.dataset.key===key) return; w.dataset.key=key; w.innerHTML='';
      items.forEach(x=>{const d=document.createElement('div');d.className='chip';d.textContent=x.a;w.appendChild(d)}); });
  }
  function renderQA(){
    const el = document.getElementById('qlist'); if(!el) return;
    const qs = Object.entries(Q).filter(([id])=>!hiddenQ.has(id)).map(([id,q])=>({id,...q,n:(U[id]?U[id].size:0)})).sort((a,b)=>b.n-a.n||a.time-b.time).slice(0,6);
    el.innerHTML = qs.length ? '' : '<div class="lead mute">Belum ada pertanyaan. Scan QR dan kirim dari HP kamu.</div>';
    qs.forEach(q=>{const d=document.createElement('div');d.className='qi'+(pinQ===q.id?' pin':'');
      d.innerHTML=`<div class="v">${q.n}<small>vote</small></div><p></p><button title="Sembunyikan" aria-label="Sembunyikan">×</button>`;
      d.querySelector('p').textContent=q.t; d.onclick=()=>{pinQ = pinQ===q.id?null:q.id; renderQA();};
      d.querySelector('button').onclick=e=>{e.stopPropagation();hiddenQ.add(q.id);ls.set('hrs25-hiddenq',[...hiddenQ]);renderQA();};
      el.appendChild(d);});
  }
  function renderRecap(){
    const el = document.getElementById('recap'); if(!el) return;
    el.innerHTML = ['p1','p2','p3','p4','p5','p6'].map(p=>{const P=POLLS[p],{c,total}=tally(p);
      if(P.type==='scale'){const s=c.reduce((a,v,i)=>a+v*(i+1),0);return `<div class="rc"><small>${esc(P.q)}</small><b>${total?(s/total).toFixed(1).replace('.',','):'–'} dari 5</b><span>${total} jawaban</span></div>`}
      const m=Math.max(...c), i=c.indexOf(m);
      return `<div class="rc"><small>${esc(P.q)}</small><b>${total?esc(P.opts[i]):'Belum ada jawaban'}</b><span>${total?Math.round(m/total*100)+'% dari '+total+' jawaban':''}</span></div>`}).join('');
  }
  let raf=0; const renderAll=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; PID.forEach(renderPoll); renderQA(); renderRecap();}); };

  function ingest(d, t){
    if (!d || typeof d!=='object' || typeof d.id!=='string') return;
    if ((d.k==='v'||d.k==='w') && V[d.p]) { const prev=V[d.p][d.id]; if(!prev||prev.t<=t) V[d.p][d.id] = {a: d.k==='w'? String(d.a).slice(0,60) : +d.a, t}; }
    else if (d.k==='q' && typeof d.qid==='string') { Q[d.qid] = {t:String(d.t).slice(0,220), time:t}; }
    else if (d.k==='u' && typeof d.qid==='string') { (U[d.qid] ||= new Set()); d.on===false ? U[d.qid].delete(d.id) : U[d.qid].add(d.id); }
    renderAll();
  }
  function setConn(s){ conn=s; const dot=document.getElementById('cdot'), t=document.getElementById('ctext');
    dot.className='dot '+(s==='live'?'live':s==='err'?'err':''); t.textContent = s==='live' ? 'Live voting aktif' : s==='err' ? 'Offline · pakai tally manual (M)' : 'Menghubungkan…'; }
  try {
    const es = new EventSource(RELAY + TV + '/sse?since=all');
    es.onopen = ()=>setConn('live');
    es.onerror = ()=>setConn('err');
    es.onmessage = e => { try { const m=JSON.parse(e.data); if (m.event!=='message') return; ingest(JSON.parse(m.message), m.time); } catch(x){} };
  } catch(e){ setConn('err'); }

  let pubT=0;
  function publish(){ clearTimeout(pubT); pubT=setTimeout(()=>{ const s=S[idx];
    fetch(RELAY+TS,{method:'POST',body:JSON.stringify({slide:idx,poll:s.poll||null,qa:!!s.qa})}).catch(()=>{}); },500); }

  function go(i){
    idx = Math.max(0, Math.min(S.length-1, i)); ls.set('hrs25-idx', idx);
    stage.querySelectorAll('.slide').forEach((el,j)=>el.classList.toggle('on', j===idx));
    document.getElementById('prog').style.width = ((idx+1)/S.length*100)+'%';
    document.getElementById('cpage').textContent = `${idx+1} / ${S.length}`;
    stage.classList.toggle('manual', manual);
    renderNotes(); renderAll(); publish();
  }
  const notesEl = document.createElement('div'); notesEl.id='notes'; notesEl.className='hidden'; document.body.appendChild(notesEl);
  function renderNotes(){ notesEl.classList.toggle('hidden', !showNotes); notesEl.innerHTML = `<div class="mute" style="font-size:13px;margin-bottom:6px">Catatan pembicara · slide ${idx+1}</div>` + (S[idx].notes||'Tidak ada catatan.'); }
  const help = document.createElement('div'); help.id='help';
  help.innerHTML = `<kbd>→</kbd> <kbd>←</kbd> pindah slide · <kbd>N</kbd> catatan · <kbd>Q</kbd> QR besar · <kbd>F</kbd> layar penuh<br><kbd>M</kbd> tally manual (klik opsi +1, Shift+klik −1) · <kbd>R</kbd> reset polling ini · <kbd>S</kbd> setelan · <kbd>H</kbd> sembunyikan bantuan`;
  document.body.appendChild(help); setTimeout(()=>{showHelp=false;help.classList.add('hidden')},12000);

  function overlay(html, onMount){ const o=document.createElement('div'); o.className='ov'; o.innerHTML=html; o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); onMount&&onMount(o); return o; }
  function bigQR(){ overlay(`<div class="qrbig"><h2>Scan untuk ikut voting</h2><div data-qr="520"></div><div class="url" style="font-size:26px;margin-top:16px"></div></div>`, o=>{ qr(o.querySelector('[data-qr]'),520); o.querySelector('.url').textContent=joinUrl(); }); }
  function settings(){ overlay(`<form class="set"><h3 style="font-size:28px">Setelan</h3>
    <label for="ju">URL untuk audiens (yang di-encode di QR)</label><input id="ju" type="url" placeholder="https://…">
    <div class="mute" style="font-size:14px">Kosongkan untuk memakai alamat halaman ini. Room relay: ${esc(ROOM)}</div>
    <div class="row" style="gap:10px;justify-content:flex-end"><button type="button" class="btn alt" id="rs">Reset semua polling</button><button class="btn">Simpan</button></div></form>`, o=>{
      const f=o.querySelector('form'), inp=o.querySelector('#ju'); inp.value=ls.get('hrs25-join','');
      f.onsubmit=e=>{e.preventDefault(); ls.set('hrs25-join', inp.value.trim()); location.reload();};
      o.querySelector('#rs').onclick=()=>{ const now=Date.now()/1000; PID.forEach(p=>{R[p]=now;M[p]=[]}); ls.set('hrs25-reset',R); ls.set('hrs25-manual',M); toast('Semua polling di-reset'); o.remove(); renderAll(); };
    }); }
  function confirmReset(p){ overlay(`<div class="set"><h3 style="font-size:26px">Reset polling ini?</h3><div>Jawaban sebelumnya diabaikan, audiens bisa vote ulang.</div><div class="row" style="gap:10px;justify-content:flex-end"><button class="btn alt" id="no">Batal</button><button class="btn" id="yes">Reset</button></div></div>`, o=>{
    o.querySelector('#no').onclick=()=>o.remove(); o.querySelector('#yes').onclick=()=>{R[p]=Date.now()/1000; M[p]=[]; ls.set('hrs25-reset',R); ls.set('hrs25-manual',M); o.remove(); renderAll(); toast('Polling di-reset');}; }); }

  stage.addEventListener('click', e=>{
    const b = e.target.closest('.bar,.col'); if (!manual || !b) return;
    const p = S[idx].poll; if(!p) return; const i=+b.dataset.i; M[p] ||= []; M[p][i] = Math.max(0,(M[p][i]||0) + (e.shiftKey?-1:1)); ls.set('hrs25-manual',M); renderAll();
  });
  document.addEventListener('keydown', e=>{
    if (e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (['arrowright','pagedown',' ','enter'].includes(k)) { e.preventDefault(); go(idx+1); }
    else if (['arrowleft','pageup','backspace'].includes(k)) { e.preventDefault(); go(idx-1); }
    else if (k==='home') go(0); else if (k==='end') go(S.length-1);
    else if (k==='n') { showNotes=!showNotes; renderNotes(); }
    else if (k==='h') { showHelp=!showHelp; help.classList.toggle('hidden',!showHelp); }
    else if (k==='m') { manual=!manual; stage.classList.toggle('manual',manual); toast(manual?'Tally manual ON: klik opsi untuk +1':'Tally manual OFF'); }
    else if (k==='r' && S[idx].poll) confirmReset(S[idx].poll);
    else if (k==='q') { const o=document.querySelector('.ov'); o?o.remove():bigQR(); }
    else if (k==='s') settings();
    else if (k==='escape') document.querySelector('.ov')?.remove();
    else if (k==='f') { try{ document.fullscreenElement? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(x){} }
  });
  let tx=0; stage.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
  stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>50) go(idx+(d<0?1:-1));});
  const fit=()=>{ const s=Math.min(innerWidth/1600, innerHeight/900); stage.style.transform=`scale(${s})`; };
  addEventListener('resize', fit); fit(); setConn('off'); go(idx);
  setInterval(publish, 20000); // late joiners: re-announce current slide
}

/* ============ AUDIENCE ============ */
function audience(){
  const root = document.getElementById('aud'); root.classList.remove('hidden');
  let me = ls.get('hrs25-me',''); if(!me){ me = Math.random().toString(36).slice(2)+Date.now().toString(36); ls.set('hrs25-me',me); }
  const mine = ls.get('hrs25-mine',{}), myUps = new Set(ls.get('hrs25-ups',[])), myQs = ls.get('hrs25-myqs',[]);
  let cur = {poll:null}, tab='poll', busy=false, ok='';
  const Q = {}, U = {};
  root.innerHTML = `<div class="atop"><span class="abrand">HR Stories #25</span><span id="ast">Menghubungkan…</span></div>
    <div class="tabs"><button data-t="poll" class="on">Voting</button><button data-t="qa">Tanya speaker</button></div><div id="abody"></div>`;
  root.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; root.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); draw();});
  const B = ()=>document.getElementById('abody');

  async function send(body, done){
    if (busy) return; busy=true; draw();
    try { const r = await post(body); if(!r.ok) throw 0; done&&done(); ok='Tercatat. Lihat hasilnya di layar.'; }
    catch(e){ ok='Gagal terkirim, coba lagi sebentar.'; }
    setTimeout(()=>{busy=false; draw();}, 1200); draw();
  }
  function draw(){
    const b = B();
    if (tab==='qa') return drawQA(b);
    const p = cur.poll, P = POLLS[p];
    if (!P) { b.innerHTML = `<div class="acard wait"><svg viewBox="0 0 120 120"><rect x="56" y="40" width="8" height="50" rx="4" fill="#3fb27c"/><path d="M60 60 C70 44 92 44 98 54 C86 62 70 64 60 60Z" fill="#3fb27c"/><path d="M60 72 C50 56 28 56 22 66 C34 74 50 76 60 72Z" fill="#8fd9a8"/><path d="M34 90h52l-6 26H40z" fill="#f5c542"/></svg>
      <h2>Dengerin dulu, ya</h2><p class="mute">Pertanyaan voting akan muncul di sini otomatis saat speaker membukanya. Sambil nunggu, kamu bisa kirim pertanyaan di tab "Tanya speaker".</p></div>`; return; }
    let html = `<div class="acard"><h2></h2>`;
    if (P.type==='choice') html += P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" ${busy?'disabled':''}><span class="k">${L[i]}</span><span></span></button>`).join('');
    else if (P.type==='scale') html += `<div class="scl">${P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" ${busy?'disabled':''}>${o}</button>`).join('')}</div><div class="ends2"><span>1 = ${esc(P.lo)}</span><span style="text-align:right">5 = ${esc(P.hi)}</span></div>`;
    else html += `<input class="ainput" id="wt" maxlength="60" placeholder="Contoh: retro 30 menit tiap Jumat" value="${esc(mine[p]||'')}"><button class="abtn" id="ws" ${busy?'disabled':''}>Kirim</button>`;
    html += `<div class="ok">${esc(ok)}</div></div>`;
    b.innerHTML = html; b.querySelector('h2').textContent = P.q;
    if (P.opts) b.querySelectorAll('.opt').forEach(o=>{ const i=+o.dataset.i; const sp=o.querySelector('span:last-child'); if(P.type==='choice') sp.textContent=P.opts[i];
      o.onclick=()=>{ mine[p]=i; ls.set('hrs25-mine',mine); send({k:'v',p,a:i,id:me}); }; });
    else { const inp=b.querySelector('#wt'); b.querySelector('#ws').onclick=()=>{ const v=inp.value.trim(); if(!v) return; mine[p]=v; ls.set('hrs25-mine',mine); send({k:'w',p,a:v,id:me}); }; }
  }
  function drawQA(b){
    const qs = Object.entries(Q).map(([id,q])=>({id,...q,n:U[id]?U[id].size:0})).sort((a,b)=>b.n-a.n||b.time-a.time).slice(0,30);
    b.innerHTML = `<div class="acard"><h2>Punya pertanyaan untuk speaker?</h2><textarea class="ainput" id="qt" rows="3" maxlength="220" placeholder="Tulis pertanyaanmu…"></textarea><button class="abtn" id="qs" ${busy?'disabled':''}>Kirim pertanyaan</button><div class="ok">${esc(ok)}</div></div>
      <div class="acard"><h2 style="font-size:20px">Vote pertanyaan yang kamu mau dibahas</h2><div id="ql">${qs.length?'':'<p class="mute">Belum ada pertanyaan.</p>'}</div></div>`;
    const ql = b.querySelector('#ql');
    qs.forEach(q=>{ const d=document.createElement('div'); d.className='aq'; d.innerHTML=`<p></p><button class="up ${myUps.has(q.id)?'on':''}">+${q.n}</button>`; d.querySelector('p').textContent=q.t;
      d.querySelector('button').onclick=()=>{ const on=!myUps.has(q.id); on?myUps.add(q.id):myUps.delete(q.id); ls.set('hrs25-ups',[...myUps]);
        (U[q.id] ||= new Set()); on?U[q.id].add(me):U[q.id].delete(me); post({k:'u',qid:q.id,on,id:me}).catch(()=>{}); drawQA(b); };
      ql.appendChild(d); });
    b.querySelector('#qs').onclick=()=>{ const t=b.querySelector('#qt').value.trim(); if(!t) return; const qid=Math.random().toString(36).slice(2,10);
      send({k:'q',qid,t,id:me}, ()=>{ myQs.push(qid); ls.set('hrs25-myqs',myQs); }); };
  }
  const st = document.getElementById('ast');
  try {
    const es = new EventSource(RELAY + TS + '/sse?since=30m');
    es.onopen=()=>st.textContent='Terhubung'; es.onerror=()=>st.textContent='Menyambung ulang…';
    es.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.event!=='message') return; const d=JSON.parse(m.message);
      const np = POLLS[d.poll] ? d.poll : null; if (np!==cur.poll){ cur={poll:np}; ok=''; if(np && tab==='qa'){} if(!document.querySelector('#qt:focus')) draw(); } if (d.qa && tab!=='qa' && !np) { } }catch(x){} };
    const ev = new EventSource(RELAY + TV + '/sse?since=all');
    ev.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.event!=='message') return; const d=JSON.parse(m.message);
      if(d.k==='q'&&typeof d.qid==='string') Q[d.qid]={t:String(d.t).slice(0,220),time:m.time};
      else if(d.k==='u'&&typeof d.qid==='string'){ (U[d.qid] ||= new Set()); d.on===false?U[d.qid].delete(d.id):U[d.qid].add(d.id); } else return;
      if(tab==='qa' && !document.querySelector('#qt:focus') && !document.querySelector('#qt')?.value) drawQA(B()); }catch(x){} };
  } catch(e){ st.textContent='Offline'; }
  draw();
}

(location.hash === '#host') ? host() : audience();
addEventListener('hashchange', ()=>location.reload());
}
</script>
