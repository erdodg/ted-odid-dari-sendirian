<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Culture · Erdo · HRS #25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: warm, practical talk-show energy in casual Indonesian; one speaker (Erdo).
   IDEA: a nursery bench — some pots keep growing, some stall. Each segment is its own colour of bloom.
   PICTURE: SVG pots with a flowering plant on the cover; poll bars grow like coloured stems.
   COLOUR and TYPE: forest green base, coral / sky / sun / berry / leaf per segment; Familjen Grotesk + Inter.
   LAYOUT: fluid unit --u from the viewport; landscape = 16:9 composition, portrait/phone = stacked and scrollable. */
:root{--g:#0d3a2b;--g2:#15563f;--leaf:#3fb27c;--leaf2:#8fd9a8;--sun:#f5c542;--coral:#ff6f59;--sky:#4aa8ff;--berry:#e0457b;--teal:#17b3a3;
--paper:#f8f6ef;--ink:#10241b;--mute:#5d6f66;--hd:"Familjen Grotesk",system-ui,sans-serif;--bd:Inter,system-ui,sans-serif;
--u:min(calc(100vw / 1600),calc(100vh / 900));color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:16px/1.5 var(--bd);background:var(--g);color:var(--paper);overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hidden{display:none!important}

/* ---------- HOST (fluid) ---------- */
#host{position:fixed;inset:0;background:var(--g)}
.slide{position:absolute;inset:0;padding:calc(var(--u)*70) calc(var(--u)*96) calc(var(--u)*110);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:hidden;--acc:var(--leaf)}
.slide.on{opacity:1;pointer-events:auto}
.dark{background:var(--g);color:var(--paper)}
.light{background:var(--paper);color:var(--ink)}
.coral{background:var(--coral);color:var(--ink)}.sky{background:var(--sky);color:var(--ink)}.sunb{background:var(--sun);color:var(--ink)}.berry{background:var(--berry);color:#fff}.leafb{background:var(--leaf);color:var(--ink)}
.a-coral{--acc:var(--coral)}.a-sky{--acc:var(--sky)}.a-sun{--acc:var(--sun)}.a-berry{--acc:var(--berry)}.a-leaf{--acc:var(--leaf)}
.light:before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*18);background:var(--acc)}
.seg{font:600 calc(var(--u)*20)/1.2 var(--bd);margin-bottom:calc(var(--u)*24);display:inline-flex;align-items:center;gap:calc(var(--u)*10)}
.seg:before{content:"";width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;background:var(--acc)}
.dark .seg{color:var(--leaf2)}
.light .seg{color:var(--g2)}
h1,h2,h3{font-family:var(--hd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:calc(var(--u)*110);line-height:1}
h2{font-size:calc(var(--u)*62);line-height:1.05}
h3{font-size:calc(var(--u)*32);line-height:1.15}
.lead{font-size:calc(var(--u)*28);line-height:1.4;max-width:calc(var(--u)*1150)}
.small{font-size:calc(var(--u)*17)}
.mute{color:var(--mute)}.dark .mute{color:#a8c7b8}
.row{display:flex;gap:calc(var(--u)*40)}
.grow{flex:1}
.src{margin-top:auto;padding-top:calc(var(--u)*16);font-size:calc(var(--u)*16);opacity:.7}
.chrome{position:fixed;left:calc(var(--u)*96);right:calc(var(--u)*96);bottom:calc(var(--u)*28);display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*17);z-index:5;pointer-events:none}
.chrome>span{background:rgba(8,38,28,.85);color:#f8f6ef;padding:calc(var(--u)*8) calc(var(--u)*16);border-radius:99px;display:inline-flex;gap:calc(var(--u)*10);align-items:center;font-weight:600}
.prog{position:fixed;left:0;bottom:0;height:calc(var(--u)*7);background:linear-gradient(90deg,var(--coral),var(--sun),var(--leaf),var(--sky),var(--berry));transition:width .4s;z-index:5}
.dot{width:calc(var(--u)*12);height:calc(var(--u)*12);min-width:8px;min-height:8px;border-radius:50%;background:#999}
.dot.live{background:var(--leaf);animation:pulse 1.8s infinite}
.dot.err{background:var(--coral)}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(63,178,124,0)}0%{box-shadow:0 0 0 0 rgba(63,178,124,.7)}}
.step{opacity:0;transform:translateY(calc(var(--u)*30));transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.step.shown{opacity:1;transform:none}

/* cover */
.cover{display:grid;grid-template-columns:1.15fr .85fr;gap:calc(var(--u)*40);height:100%}
.cover h1{font-size:calc(var(--u)*92);margin:calc(var(--u)*14) 0 calc(var(--u)*26)}
.who{font-size:calc(var(--u)*24)}.who b{display:block;font:700 calc(var(--u)*34)/1.15 var(--hd);color:var(--sun)}
.joinbox{display:flex;gap:calc(var(--u)*26);align-items:center;background:var(--paper);color:var(--ink);border-radius:calc(var(--u)*22);padding:calc(var(--u)*22);margin-top:auto;border-left:calc(var(--u)*14) solid var(--coral)}
.joinbox canvas,.qrbig canvas,.qrsmall canvas{display:block;border-radius:10px;background:#fff;width:calc(var(--u)*170);height:calc(var(--u)*170)}
.qrsmall canvas{width:calc(var(--u)*210);height:calc(var(--u)*210)}
.joinbox b{font:700 calc(var(--u)*30)/1.1 var(--hd)}
.url{font:600 calc(var(--u)*19)/1.3 var(--bd);word-break:break-all;color:var(--g2)}
.plants{width:100%;height:100%}
.stem{transform-origin:bottom center;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
.leafg{transform-box:fill-box;transform-origin:left bottom;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}

/* poll */
.pollgrid{display:grid;grid-template-columns:1fr calc(var(--u)*330);gap:calc(var(--u)*40);flex:1;min-height:0}
.pollq{font:700 calc(var(--u)*56)/1.06 var(--hd);text-wrap:balance}
.bars{margin-top:calc(var(--u)*36);display:flex;flex-direction:column;gap:calc(var(--u)*16)}
.bar{display:grid;grid-template-columns:calc(var(--u)*56) 1fr calc(var(--u)*130);align-items:center;gap:calc(var(--u)*18);font-size:calc(var(--u)*27)}
.bar .k{width:calc(var(--u)*52);height:calc(var(--u)*52);border-radius:calc(var(--u)*14);display:grid;place-items:center;font:700 calc(var(--u)*24) var(--hd);background:var(--c);color:var(--ink)}
.track{position:relative;height:calc(var(--u)*62);border-radius:calc(var(--u)*16);background:rgba(13,58,43,.07);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);opacity:.75;border-radius:calc(var(--u)*16);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.top .fill{opacity:1}
.bar.top .lbl{font-weight:700}
.lbl{position:absolute;left:calc(var(--u)*22);right:calc(var(--u)*14);top:50%;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{text-align:right;font:700 calc(var(--u)*34) var(--hd)}
.pct small{display:block;font:500 calc(var(--u)*16) var(--bd);opacity:.65}
.manual .bar,.manual .col{cursor:pointer}
.manual .track{outline:2px dashed var(--coral)}
.pollside{display:flex;flex-direction:column;gap:calc(var(--u)*16);align-items:center;text-align:center}
.count{font:700 calc(var(--u)*120)/1 var(--hd);color:var(--acc)}
.light .count{-webkit-text-stroke:calc(var(--u)*2) var(--ink)}
.scaleWrap{display:flex;gap:calc(var(--u)*24);align-items:flex-end;height:calc(var(--u)*380);margin-top:calc(var(--u)*30)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10);height:100%;justify-content:flex-end}
.colbar{width:100%;border-radius:calc(var(--u)*18) calc(var(--u)*18) 6px 6px;background:var(--c);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col b{font:700 calc(var(--u)*38) var(--hd)}
.col span{font:700 calc(var(--u)*28) var(--hd)}
.avgbox{display:flex;align-items:baseline;gap:calc(var(--u)*16)}
.avg{font:700 calc(var(--u)*130)/1 var(--hd);color:var(--acc);-webkit-text-stroke:calc(var(--u)*2) var(--ink)}
.ends{display:flex;justify-content:space-between;gap:20px;font-size:calc(var(--u)*21);margin-top:calc(var(--u)*12)}
.wall{flex:1;display:flex;flex-wrap:wrap;gap:calc(var(--u)*14);align-content:flex-start;margin-top:calc(var(--u)*36);overflow:hidden}
.chip{padding:calc(var(--u)*14) calc(var(--u)*24);border-radius:99px;font:500 calc(var(--u)*25)/1.2 var(--bd);animation:pop .5s both;max-width:100%;background:var(--c);color:var(--ink)}

/* content */
.split{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*32);margin-top:calc(var(--u)*40);flex:1}
.panel{border-radius:calc(var(--u)*26);padding:calc(var(--u)*36) calc(var(--u)*40)}
.panel h3{margin-bottom:calc(var(--u)*18)}
.panel ul{margin:0;padding:0;list-style:none;font-size:calc(var(--u)*26);line-height:1.35}
.panel li{padding:calc(var(--u)*13) 0;border-top:1px solid rgba(13,58,43,.15)}
.p-grey{background:#e7e5dc;color:#5c6460}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*22);margin-top:calc(var(--u)*44);flex:1}
.card{border-radius:calc(var(--u)*24);padding:calc(var(--u)*32) calc(var(--u)*28);background:var(--c);color:var(--ink);display:flex;flex-direction:column;gap:calc(var(--u)*14)}
.card .n{width:calc(var(--u)*54);height:calc(var(--u)*54);border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 calc(var(--u)*24) var(--hd)}
.card h3{font-size:calc(var(--u)*30)}
.card p{margin:0;font-size:calc(var(--u)*21);line-height:1.4}
.timeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:calc(var(--u)*50);position:relative}
.timeline:before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*19);height:calc(var(--u)*5);background:linear-gradient(90deg,var(--coral),var(--sun),var(--leaf),var(--sky),var(--berry));border-radius:4px}
.tl{position:relative;padding-top:calc(var(--u)*58);padding-right:calc(var(--u)*16)}
.tl:before{content:"";position:absolute;top:calc(var(--u)*4);left:0;width:calc(var(--u)*32);height:calc(var(--u)*32);border-radius:50%;background:var(--c);border:calc(var(--u)*5) solid var(--g)}
.tl b{display:block;font:700 calc(var(--u)*25)/1.15 var(--hd)}
.tl span{font-size:calc(var(--u)*18);line-height:1.35;display:block;margin-top:calc(var(--u)*8);opacity:.85}
.comm{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*30);margin-top:auto}
.cbox{border-radius:calc(var(--u)*24);padding:calc(var(--u)*28) calc(var(--u)*32);display:flex;gap:calc(var(--u)*24);align-items:center}
.cbox .big{font:700 calc(var(--u)*110)/1 var(--hd);flex:none}
.cbox>div:last-child{flex:1}
.cbox .yr{font:700 calc(var(--u)*22) var(--hd);display:inline-block;padding:calc(var(--u)*4) calc(var(--u)*14);border-radius:99px;background:rgba(0,0,0,.14);margin-bottom:calc(var(--u)*8)}
.cbox p{margin:0;font-size:calc(var(--u)*22);line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*22);margin-top:calc(var(--u)*40);flex:1}
.stat{border-radius:calc(var(--u)*24);padding:calc(var(--u)*30);background:var(--c);color:var(--ink);display:flex;flex-direction:column;gap:calc(var(--u)*12)}
.stat b{font:700 calc(var(--u)*92)/1 var(--hd)}
.stat p{margin:0;font-size:calc(var(--u)*22);line-height:1.38}
.stat small{margin-top:auto;font-size:calc(var(--u)*15);opacity:.75}
.tgk{display:grid;grid-template-columns:1.2fr .8fr;gap:calc(var(--u)*40);margin-top:calc(var(--u)*30);flex:1;min-height:0}
.metric{margin-bottom:calc(var(--u)*24)}
.metric h4{margin:0 0 calc(var(--u)*10);font:600 calc(var(--u)*21) var(--bd)}
.yb{display:grid;grid-template-columns:calc(var(--u)*70) 1fr calc(var(--u)*170);gap:calc(var(--u)*14);align-items:center;margin:calc(var(--u)*6) 0;font-size:calc(var(--u)*19)}
.yb i{display:block;height:calc(var(--u)*30);border-radius:calc(var(--u)*8);background:var(--c);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.on .yb i{width:var(--w)}
.yb em{font-style:normal;font-weight:700;text-align:right;white-space:nowrap}
.prog-list{display:flex;flex-direction:column;gap:calc(var(--u)*16)}
.pg{border-radius:calc(var(--u)*20);padding:calc(var(--u)*20) calc(var(--u)*24);background:var(--c);color:var(--ink)}
.pg b{font:700 calc(var(--u)*26)/1.1 var(--hd);display:block}
.pg span{font-size:calc(var(--u)*18);line-height:1.35;display:block;margin-top:calc(var(--u)*6)}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*26);margin-top:calc(var(--u)*44);flex:1}
.beat{border-radius:calc(var(--u)*22);padding:calc(var(--u)*26);background:var(--c);color:var(--ink)}
.beat small{font:700 calc(var(--u)*20) var(--hd)}
.beat p{font-size:calc(var(--u)*26);line-height:1.4;margin:calc(var(--u)*10) 0 0}
.beat p.todo{opacity:.6;font-style:italic}
.quote{font:700 calc(var(--u)*80)/1.08 var(--hd);text-wrap:balance}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*24);margin-top:calc(var(--u)*36);flex:1}
.qlist{display:flex;flex-direction:column;gap:calc(var(--u)*14);overflow:hidden}
.qi{display:grid;grid-template-columns:calc(var(--u)*84) 1fr calc(var(--u)*44);gap:calc(var(--u)*18);align-items:center;background:#fff;border-radius:calc(var(--u)*20);padding:calc(var(--u)*18) calc(var(--u)*22);color:var(--ink);border-left:calc(var(--u)*10) solid var(--c)}
.qi .v{font:700 calc(var(--u)*36) var(--hd);text-align:center}
.qi .v small{display:block;font:500 calc(var(--u)*14) var(--bd);color:var(--mute)}
.qi p{margin:0;font-size:calc(var(--u)*25);line-height:1.35}
.qi button{border:0;background:transparent;font-size:calc(var(--u)*26);color:#a33;opacity:.4}
.qi.pin{outline:calc(var(--u)*4) solid var(--sun)}
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*20);margin-top:calc(var(--u)*36);flex:1}
.rc{background:var(--c);color:var(--ink);border-radius:calc(var(--u)*22);padding:calc(var(--u)*24) calc(var(--u)*26);display:flex;flex-direction:column;gap:calc(var(--u)*8)}
.rc small{font-size:calc(var(--u)*17)}
.rc b{font:700 calc(var(--u)*29)/1.15 var(--hd)}
.rc span{font-size:calc(var(--u)*18);opacity:.75}

/* portrait / phone: stack and scroll */
@media (orientation:portrait),(max-width:700px){
  :root{--u:calc(100vw / 760)}
  .slide{overflow-y:auto;padding:calc(var(--u)*56) calc(var(--u)*48) calc(var(--u)*150)}
  .light:before{width:calc(var(--u)*12)}
  h1{font-size:calc(var(--u)*84)} .cover h1{font-size:calc(var(--u)*72)}
  .cover,.pollgrid,.split,.tgk,.comm{grid-template-columns:1fr}
  .cover{height:auto}
  .cover>div:last-child{height:calc(var(--u)*520)}
  .joinbox{margin-top:calc(var(--u)*30)}
  .cards,.stats,.recap{grid-template-columns:1fr 1fr}
  .roles,.story{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr 1fr;row-gap:calc(var(--u)*30)}
  .timeline:before{display:none}
  .comm{margin-top:calc(var(--u)*40)}
  .pollside{flex-direction:row;justify-content:space-between;order:-1}
  .pollgrid,.split,.tgk,.cards,.stats,.roles,.story,.recap{flex:none;align-content:start}
  .qrsmall canvas{width:calc(var(--u)*170);height:calc(var(--u)*170)}
  .pollq{font-size:calc(var(--u)*48)}
  .bar{grid-template-columns:calc(var(--u)*52) 1fr calc(var(--u)*110)}
  .lbl{white-space:normal;line-height:1.15}
  .track{height:calc(var(--u)*78)}
  .chrome{left:calc(var(--u)*24);right:calc(var(--u)*24)}
}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,25,18,.92);display:grid;place-items:center;z-index:20;padding:16px}
.qrbig{background:var(--paper);color:var(--ink);border-radius:28px;padding:32px;text-align:center;max-width:92vw;border-top:14px solid var(--coral)}
.qrbig h2{font-size:clamp(26px,4vw,44px);margin-bottom:16px}
.qrbig canvas{width:min(70vh,80vw);height:min(70vh,80vw);margin:auto}
.qrbig .url{font-size:clamp(14px,2vw,24px);margin-top:12px}
#notes{position:fixed;right:12px;bottom:12px;width:min(520px,92vw);max-height:60vh;overflow:auto;background:#fffbe8;color:#2a2a1f;border-radius:16px;padding:18px 22px;z-index:15;font-size:15px;line-height:1.5;box-shadow:0 20px 50px rgba(0,0,0,.4);border-top:8px solid var(--sun)}
#notes h4{margin:0 0 8px;font:700 17px var(--hd)}
#notes ul{padding-left:20px;margin:6px 0}
#help{position:fixed;right:12px;top:12px;z-index:15;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;max-width:92vw}
#help kbd{background:#fff;color:#000;border-radius:4px;padding:0 6px;font:600 12px var(--bd)}
.set{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px;width:min(620px,92vw);display:flex;flex-direction:column;gap:12px}
.set label{font-weight:600}
.set input{font:16px var(--bd);padding:12px;border-radius:10px;border:1px solid #bbb;width:100%}
.btn{border:0;border-radius:12px;padding:12px 20px;min-height:44px;background:var(--g);color:var(--paper);font-weight:600}
.btn.alt{background:#ddd;color:#222}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);padding:10px 20px;border-radius:99px;font-weight:600;z-index:30}

/* ---------- AUDIENCE (phone) ---------- */
#aud{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:18px 18px 40px}
.atop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#a8c7b8}
.abrand{font:700 20px var(--hd);color:var(--paper)}
.stripe{height:6px;border-radius:6px;margin-top:12px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--leaf),var(--sky),var(--berry))}
.acard{background:var(--paper);color:var(--ink);border-radius:24px;padding:24px 20px;margin-top:18px}
.acard h2{font-size:26px;line-height:1.15;margin-bottom:18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid #d9dcd3;background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin-top:10px;min-height:56px;font-size:16px;transition:transform .15s}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;font:700 16px var(--hd)}
.opt.sel{border-color:var(--ink);background:color-mix(in srgb,var(--c) 22%,#fff)}
.scl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scl .opt{justify-content:center;font:700 22px var(--hd);padding:0;border-color:var(--c)}
.scl .opt.sel{background:var(--c)}
.ends2{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:8px;gap:12px}
.ainput{width:100%;font:16px var(--bd);padding:14px;border-radius:14px;border:2px solid #d9dcd3;resize:vertical}
.abtn{margin-top:12px;width:100%;border:0;border-radius:14px;background:var(--coral);color:var(--ink);font-weight:700;min-height:52px;font-size:16px}
.abtn:disabled{opacity:.5}
.ok{margin-top:14px;font-size:14px;color:var(--g2);font-weight:600;min-height:20px}
.wait{text-align:center;padding:30px 10px}
.wait svg{width:120px;height:120px}
.aq{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #e3e5dd}
.aq p{margin:0;flex:1;font-size:15px}
.up{flex:none;border:2px solid #d9dcd3;background:#fff;border-radius:12px;min-width:56px;min-height:44px;font-weight:700;color:var(--g2)}
.up.on{background:var(--sky);color:var(--ink);border-color:var(--sky)}
.tabs{display:flex;gap:8px;margin-top:16px}

 {cls:'leafb',html:()=>`<div style="margin:auto 0"><div class="quote">Budaya belajar kelihatan di Senin pagi, bukan di sertifikat.</div>
  <div class="lead" style="margin-top:calc(var(--u)*50)">Terima kasih. Lanjut ngobrol dan belajar bareng di <b>OD.ID</b> (orgdev.id) dan <b>Circle HR ITB</b>.</div>
  <div class="small" style="margin-top:calc(var(--u)*30);opacity:.75">Data: ATD Research (2025), LinkedIn Workplace Learning Report 2025, PT Tigaraksa Satria Tbk Laporan Tahunan & Keberlanjutan 2022.</div></div>`,
  notes:`Foto bersama, promosi komunitas.`}
];

/* ============ HOST ============ */
function host(){
  const root = document.getElementById('host'); root.classList.remove('hidden');
  let idx = Math.min(ls.get('hrs25-idx',0), S.length-1), stepN = 0, manual = false, showNotes = false;
  const V = {}; PID.forEach(p=>V[p]={});
  const M = ls.get('hrs25-manual', {}), R = ls.get('hrs25-reset', {});
  const hiddenQ = new Set(ls.get('hrs25-hiddenq', []));
  let pinQ = null; const Q = {}, U = {};

  root.innerHTML = S.map((s,i)=>`<section class="slide ${s.cls}" id="s${i}">${s.seg?`<div class="seg">${esc(s.seg)}</div>`:''}${body(s)}</section>`).join('') +
    `<div class="chrome"><span><span class="dot" id="cdot"></span><span id="ctext">Menghubungkan…</span></span><span id="cpage"></span></div><div class="prog" id="prog"></div>`;
  root.querySelectorAll('[data-qr]').forEach(el=>qr(el,+el.dataset.qr));
  root.querySelectorAll('[data-url]').forEach(el=>el.textContent=joinUrl().replace(/^https?:\/\//,''));

  function body(s){
    if (s.html) return s.html();
    if (s.story){ const st=STORIES[s.story]; return `<h2>${esc(st.title)}</h2><div class="lead mute" style="margin-top:calc(var(--u)*12)">${esc(st.where)}</div>
      <div class="story">${['Situasi','Momen','Pelajaran'].map((h,i)=>`<div class="beat step" style="--c:${['var(--sun)','var(--coral)','var(--sky)'][i]}"><small>${h}</small><p class="${st.todo?'todo':''}">${esc(st.beats[i]||'')}</p></div>`).join('')}</div>`; }
    if (s.qa) return `<h2>Pertanyaan dari kamu</h2><div class="pollgrid" style="margin-top:calc(var(--u)*30)"><div class="qlist" id="qlist"></div><div class="pollside"><div class="qrsmall" data-qr="240"></div><div class="lead" style="font-size:calc(var(--u)*21)">Kirim pertanyaan lewat HP, lalu vote pertanyaan orang lain</div></div></div>`;
    if (s.recap) return `<h2>Yang kita pelajari malam ini, dari jawaban kalian</h2><div class="recap" id="recap"></div>`;
    const P = POLLS[s.poll]; let inner;
    if (P.type==='choice') inner = `<div class="bars" data-bars="${s.poll}">${P.opts.map((o,i)=>`<div class="bar" data-i="${i}" style="--c:${C[i]}"><div class="k">${L[i]}</div><div class="track"><div class="fill"></div><div class="lbl">${esc(o)}</div></div><div class="pct">0%<small>0</small></div></div>`).join('')}</div>`;
    else if (P.type==='scale') inner = `<div class="avgbox" style="margin-top:calc(var(--u)*20)"><div class="avg" data-avg="${s.poll}">–</div><div class="lead mute">rata-rata dari 5</div></div>
      <div class="scaleWrap" data-scale="${s.poll}">${P.opts.map((o,i)=>`<div class="col" data-i="${i}" style="--c:${SC[i]}"><b>0</b><div class="colbar"></div><span>${o}</span></div>`).join('')}</div><div class="ends"><span>1 = ${esc(P.lo)}</span><span style="text-align:right">5 = ${esc(P.hi)}</span></div>`;
    else inner = `<div class="wall" data-wall="${s.poll}"></div>`;
    return `<div class="pollgrid"><div style="display:flex;flex-direction:column;min-height:0"><div class="pollq">${esc(P.q)}</div>${inner}</div>
      <div class="pollside"><div class="qrsmall" data-qr="240"></div><div><div class="count" data-count="${s.poll}">0</div><div class="mute small">jawaban masuk</div></div></div></div>`;
  }

  function tally(p){
    const P = POLLS[p], n = P.opts ? P.opts.length : 0, c = new Array(n).fill(0), list = [];
    for (const v of Object.values(V[p])) { if (v.t < (R[p]||0)) continue; if (P.type==='text') list.push(v); else if (v.a>=0 && v.a<n) c[v.a]++; }
    (M[p]||[]).forEach((m,i)=>{ if(i<n) c[i]+=m||0; });
    return {c, list, total: P.type==='text' ? list.length : c.reduce((a,b)=>a+b,0)};
  }
  function renderPoll(p){
    const {c,list,total} = tally(p), max = Math.max(...c, 0);
    root.querySelectorAll(`[data-count="${p}"]`).forEach(e=>e.textContent=total);
    root.querySelectorAll(`[data-bars="${p}"] .bar`).forEach(b=>{const i=+b.dataset.i, pc= total? Math.round(c[i]/total*100):0;
      b.querySelector('.fill').style.width = pc+'%'; b.querySelector('.pct').innerHTML = `${pc}%<small>${c[i]} orang</small>`; b.classList.toggle('top', max>0 && c[i]===max);});
    root.querySelectorAll(`[data-scale="${p}"] .col`).forEach(b=>{const i=+b.dataset.i; b.querySelector('.colbar').style.height = (max? c[i]/max*75:0)+'%'; b.querySelector('b').textContent=c[i];});
    root.querySelectorAll(`[data-avg="${p}"]`).forEach(e=>{const s=c.reduce((a,v,i)=>a+v*(i+1),0); e.textContent = total ? (s/total).toFixed(1).replace('.',',') : '–';});
    root.querySelectorAll(`[data-wall="${p}"]`).forEach(w=>{ const items = list.sort((a,b)=>b.t-a.t).slice(0,40);
      const key = items.map(x=>x.t+x.a).join('|'); if (w.dataset.key===key) return; w.dataset.key=key; w.innerHTML='';
      items.forEach((x,i)=>{const d=document.createElement('div');d.className='chip';d.style.setProperty('--c',C[i%C.length]);d.textContent=x.a;w.appendChild(d)}); });
  }
  function renderQA(){
    const el = document.getElementById('qlist'); if(!el) return;
    const qs = Object.entries(Q).filter(([id])=>!hiddenQ.has(id)).map(([id,q])=>({id,...q,n:(U[id]?U[id].size:0)})).sort((a,b)=>b.n-a.n||a.time-b.time).slice(0,6);
    el.innerHTML = qs.length ? '' : '<div class="lead mute">Belum ada pertanyaan. Scan QR dan kirim dari HP kamu.</div>';
    qs.forEach((q,i)=>{const d=document.createElement('div');d.className='qi'+(pinQ===q.id?' pin':'');d.style.setProperty('--c',C[i%C.length]);
      d.innerHTML=`<div class="v">${q.n}<small>vote</small></div><p></p><button title="Sembunyikan" aria-label="Sembunyikan">×</button>`;
      d.querySelector('p').textContent=q.t; d.onclick=()=>{pinQ = pinQ===q.id?null:q.id; renderQA();};
      d.querySelector('button').onclick=e=>{e.stopPropagation();hiddenQ.add(q.id);ls.set('hrs25-hiddenq',[...hiddenQ]);renderQA();};
      el.appendChild(d);});
  }
  function renderRecap(){
    const el = document.getElementById('recap'); if(!el) return;
    el.innerHTML = ['p1','p2','p3','p4','p5','p6'].map((p,k)=>{const P=POLLS[p],{c,total}=tally(p), col=`style="--c:${C[k]}"`;
      if(P.type==='scale'){const s=c.reduce((a,v,i)=>a+v*(i+1),0);return `<div class="rc" ${col}><small>${esc(P.q)}</small><b>${total?(s/total).toFixed(1).replace('.',','):'–'} dari 5</b><span>${total} jawaban</span></div>`}
      const m=Math.max(...c), i=c.indexOf(m);
      return `<div class="rc" ${col}><small>${esc(P.q)}</small><b>${total?esc(P.opts[i]):'Belum ada jawaban'}</b><span>${total?Math.round(m/total*100)+'% dari '+total+' jawaban':''}</span></div>`}).join('');
  }
  let raf=0; const renderAll=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; PID.forEach(renderPoll); renderQA(); renderRecap();}); };

  function ingest(d, t){
    if (!d || typeof d!=='object' || typeof d.id!=='string') return;
    if ((d.k==='v'||d.k==='w') && V[d.p]) { const prev=V[d.p][d.id]; if(!prev||prev.t<=t) V[d.p][d.id] = {a: d.k==='w'? String(d.a).slice(0,60) : +d.a, t}; }
    else if (d.k==='q' && typeof d.qid==='string') { Q[d.qid] = {t:String(d.t).slice(0,220), time:t}; }
    else if (d.k==='u' && typeof d.qid==='string') { (U[d.qid] ||= new Set()); d.on===false ? U[d.qid].delete(d.id) : U[d.qid].add(d.id); }
    renderAll();
  }
  function setConn(s){ const dot=document.getElementById('cdot'), t=document.getElementById('ctext');
    dot.className='dot '+(s==='live'?'live':s==='err'?'err':''); t.textContent = s==='live' ? 'Live voting aktif' : s==='err' ? 'Offline · tally manual (M)' : 'Menghubungkan…'; }
  try {
    const es = new EventSource(RELAY + TV + '/sse?since=all');
    es.onopen = ()=>setConn('live'); es.onerror = ()=>setConn('err');
    es.onmessage = e => { try { const m=JSON.parse(e.data); if (m.event!=='message') return; ingest(JSON.parse(m.message), m.time); } catch(x){} };
  } catch(e){ setConn('err'); }

  let pubT=0;
  function publish(){ clearTimeout(pubT); pubT=setTimeout(()=>{ const s=S[idx];
    fetch(RELAY+TS,{method:'POST',body:JSON.stringify({slide:idx,poll:s.poll||null,qa:!!s.qa})}).catch(()=>{}); },500); }

  const stepsOf = i => [...document.getElementById('s'+i).querySelectorAll('.step')];
  function showSteps(){ stepsOf(idx).forEach((el,j)=>el.classList.toggle('shown', j<stepN)); }
  function go(i, atEnd){
    idx = Math.max(0, Math.min(S.length-1, i)); ls.set('hrs25-idx', idx);
    stepN = atEnd ? stepsOf(idx).length : 0;
    root.querySelectorAll('.slide').forEach((el,j)=>{ el.classList.toggle('on', j===idx); if(j===idx) el.scrollTop=0; });
    showSteps();
    document.getElementById('prog').style.width = ((idx+1)/S.length*100)+'%';
    document.getElementById('cpage').textContent = `${idx+1} / ${S.length}`;
    root.classList.toggle('manual', manual);
    renderNotes(); renderAll(); publish();
  }
  function next(){ if (stepN < stepsOf(idx).length){ stepN++; showSteps(); } else go(idx+1); }
  function prev(){ if (stepN > 0){ stepN--; showSteps(); } else go(idx-1, true); }

  const notesEl = document.createElement('div'); notesEl.id='notes'; notesEl.className='hidden'; document.body.appendChild(notesEl);
  function renderNotes(){ notesEl.classList.toggle('hidden', !showNotes); notesEl.innerHTML = `<div class="mute" style="font-size:12px;margin-bottom:6px">Catatan pembicara · slide ${idx+1}</div>` + (S[idx].notes||'Tidak ada catatan.'); }
  const help = document.createElement('div'); help.id='help';
  help.innerHTML = `<kbd>→</kbd> <kbd>←</kbd> pindah / munculkan · <kbd>N</kbd> catatan · <kbd>Q</kbd> QR besar · <kbd>F</kbd> layar penuh<br><kbd>M</kbd> tally manual (klik opsi +1, Shift+klik −1) · <kbd>R</kbd> reset polling · <kbd>S</kbd> setelan · <kbd>H</kbd> bantuan`;
  document.body.appendChild(help); setTimeout(()=>help.classList.add('hidden'),12000);

  function overlay(html, onMount){ const o=document.createElement('div'); o.className='ov'; o.innerHTML=html; o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); onMount&&onMount(o); return o; }
  function bigQR(){ overlay(`<div class="qrbig"><h2>Scan untuk ikut voting</h2><div data-qr="640"></div><div class="url"></div></div>`, o=>{ qr(o.querySelector('[data-qr]'),640); o.querySelector('.url').textContent=joinUrl(); }); }
  function settings(){ overlay(`<form class="set"><h3 style="font-size:26px">Setelan</h3>
    <label for="ju">URL untuk audiens (yang di-encode di QR)</label><input id="ju" type="url" placeholder="https://…">
    <div class="mute" style="font-size:14px">Kosongkan untuk memakai alamat halaman ini. Room relay: ${esc(ROOM)}</div>
    <div class="row" style="gap:10px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn alt" id="rs">Reset semua polling</button><button class="btn">Simpan</button></div></form>`, o=>{
      const f=o.querySelector('form'), inp=o.querySelector('#ju'); inp.value=ls.get('hrs25-join','');
      f.onsubmit=e=>{e.preventDefault(); ls.set('hrs25-join', inp.value.trim()); location.reload();};
      o.querySelector('#rs').onclick=()=>{ const now=Date.now()/1000; PID.forEach(p=>{R[p]=now;M[p]=[]}); ls.set('hrs25-reset',R); ls.set('hrs25-manual',M); toast('Semua polling di-reset'); o.remove(); renderAll(); };
    }); }
  function confirmReset(p){ overlay(`<div class="set"><h3 style="font-size:24px">Reset polling ini?</h3><div>Jawaban sebelumnya diabaikan, audiens bisa vote ulang.</div><div class="row" style="gap:10px;justify-content:flex-end"><button class="btn alt" id="no">Batal</button><button class="btn" id="yes">Reset</button></div></div>`, o=>{
    o.querySelector('#no').onclick=()=>o.remove(); o.querySelector('#yes').onclick=()=>{R[p]=Date.now()/1000; M[p]=[]; ls.set('hrs25-reset',R); ls.set('hrs25-manual',M); o.remove(); renderAll(); toast('Polling di-reset');}; }); }

  root.addEventListener('click', e=>{
    const b = e.target.closest('.bar,.col'); if (!manual || !b) return;
    const p = S[idx].poll; if(!p) return; const i=+b.dataset.i; M[p] ||= []; M[p][i] = Math.max(0,(M[p][i]||0) + (e.shiftKey?-1:1)); ls.set('hrs25-manual',M); renderAll();
  });
  document.addEventListener('keydown', e=>{
    if (e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (['arrowright','pagedown',' ','enter'].includes(k)) { e.preventDefault(); next(); }
    else if (['arrowleft','pageup','backspace'].includes(k)) { e.preventDefault(); prev(); }
    else if (k==='home') go(0); else if (k==='end') go(S.length-1);
    else if (k==='n') { showNotes=!showNotes; renderNotes(); }
    else if (k==='h') help.classList.toggle('hidden');
    else if (k==='m') { manual=!manual; root.classList.toggle('manual',manual); toast(manual?'Tally manual ON: klik opsi untuk +1':'Tally manual OFF'); }
    else if (k==='r' && S[idx].poll) confirmReset(S[idx].poll);
    else if (k==='q') { const o=document.querySelector('.ov'); o?o.remove():bigQR(); }
    else if (k==='s') settings();
    else if (k==='escape') document.querySelector('.ov')?.remove();
    else if (k==='f') { try{ document.fullscreenElement? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(x){} }
  });
  let tx=0, ty=0; root.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  root.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) (dx<0?next:prev)();});
  setConn('off'); go(idx);
  setInterval(publish, 20000);
}

/* ============ AUDIENCE ============ */
function audience(){
  const root = document.getElementById('aud'); root.classList.remove('hidden');
  let me = ls.get('hrs25-me',''); if(!me){ me = Math.random().toString(36).slice(2)+Date.now().toString(36); ls.set('hrs25-me',me); }
  const mine = ls.get('hrs25-mine',{}), myUps = new Set(ls.get('hrs25-ups',[]));
  let cur = {poll:null}, tab='poll', busy=false, ok='';
  const Q = {}, U = {};
  root.innerHTML = `<div class="atop"><span class="abrand">Learning Culture · Erdo</span><span id="ast">Menghubungkan…</span></div><div class="stripe"></div>
    <div class="tabs"><button data-t="poll" class="on">Voting</button><button data-t="qa">Tanya Erdo</button></div><div id="abody"></div>`;
  root.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; ok=''; root.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); draw();});
  const B = ()=>document.getElementById('abody');

  async function send(body){
    if (busy) return; busy=true; draw();
    try { const r = await post(body); if(!r.ok) throw 0; ok='Tercatat. Lihat hasilnya di layar.'; }
    catch(e){ ok='Gagal terkirim, coba lagi sebentar.'; }
    setTimeout(()=>{busy=false; draw();}, 1200); draw();
  }
  function draw(){
    const b = B();
    if (tab==='qa') return drawQA(b);
    const p = cur.poll, P = POLLS[p];
    if (!P) { b.innerHTML = `<div class="acard wait"><svg viewBox="0 0 120 120"><rect x="56" y="40" width="8" height="50" rx="4" fill="#3fb27c"/><path d="M60 60 C70 44 92 44 98 54 C86 62 70 64 60 60Z" fill="#3fb27c"/><path d="M60 72 C50 56 28 56 22 66 C34 74 50 76 60 72Z" fill="#8fd9a8"/><circle cx="60" cy="34" r="10" fill="#f5c542"/><path d="M34 90h52l-6 26H40z" fill="#ff6f59"/></svg>
      <h2>Dengerin dulu, ya</h2><p class="mute">Pertanyaan voting akan muncul di sini otomatis saat dibuka. Sambil nunggu, kamu bisa kirim pertanyaan di tab "Tanya Erdo".</p></div>`; return; }
    let html = `<div class="acard"><h2></h2>`;
    if (P.type==='choice') html += P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" style="--c:${C[i]}" ${busy?'disabled':''}><span class="k">${L[i]}</span><span></span></button>`).join('');
    else if (P.type==='scale') html += `<div class="scl">${P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" style="--c:${SC[i]}" ${busy?'disabled':''}>${o}</button>`).join('')}</div><div class="ends2"><span>1 = ${esc(P.lo)}</span><span style="text-align:right">5 = ${esc(P.hi)}</span></div>`;
    else html += `<input class="ainput" id="wt" maxlength="60" placeholder="Contoh: retro 30 menit tiap Jumat" value="${esc(mine[p]||'')}"><button class="abtn" id="ws" ${busy?'disabled':''}>Kirim</button>`;
    html += `<div class="ok">${esc(ok)}</div></div>`;
    b.innerHTML = html; b.querySelector('h2').textContent = P.q;
    if (P.opts) b.querySelectorAll('.opt').forEach(o=>{ const i=+o.dataset.i; if(P.type==='choice') o.querySelector('span:last-child').textContent=P.opts[i];
      o.onclick=()=>{ mine[p]=i; ls.set('hrs25-mine',mine); send({k:'v',p,a:i,id:me}); }; });
    else { const inp=b.querySelector('#wt'); b.querySelector('#ws').onclick=()=>{ const v=inp.value.trim(); if(!v) return; mine[p]=v; ls.set('hrs25-mine',mine); send({k:'w',p,a:v,id:me}); }; }
  }
  function drawQA(b){
    const qs = Object.entries(Q).map(([id,q])=>({id,...q,n:U[id]?U[id].size:0})).sort((a,b)=>b.n-a.n||b.time-a.time).slice(0,30);
    b.innerHTML = `<div class="acard"><h2>Punya pertanyaan untuk Erdo?</h2><textarea class="ainput" id="qt" rows="3" maxlength="220" placeholder="Tulis pertanyaanmu…"></textarea><button class="abtn" id="qs" ${busy?'disabled':''}>Kirim pertanyaan</button><div class="ok">${esc(ok)}</div></div>
      <div class="acard"><h2 style="font-size:20px">Vote pertanyaan yang kamu mau dibahas</h2><div id="ql">${qs.length?'':'<p class="mute">Belum ada pertanyaan.</p>'}</div></div>`;
    const ql = b.querySelector('#ql');
    qs.forEach(q=>{ const d=document.createElement('div'); d.className='aq'; d.innerHTML=`<p></p><button class="up ${myUps.has(q.id)?'on':''}">+${q.n}</button>`; d.querySelector('p').textContent=q.t;
      d.querySelector('button').onclick=()=>{ const on=!myUps.has(q.id); on?myUps.add(q.id):myUps.delete(q.id); ls.set('hrs25-ups',[...myUps]);
        (U[q.id] ||= new Set()); on?U[q.id].add(me):U[q.id].delete(me); post({k:'u',qid:q.id,on,id:me}).catch(()=>{}); drawQA(b); };
      ql.appendChild(d); });
    b.querySelector('#qs').onclick=()=>{ const t=b.querySelector('#qt').value.trim(); if(!t) return; const qid=Math.random().toString(36).slice(2,10); send({k:'q',qid,t,id:me}); };
  }
  const st = document.getElementById('ast');
  try {
    const es = new EventSource(RELAY + TS + '/sse?since=30m');
    es.onopen=()=>st.textContent='Terhubung'; es.onerror=()=>st.textContent='Menyambung ulang…';
    es.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.event!=='message') return; const d=JSON.parse(m.message);
      const np = POLLS[d.poll] ? d.poll : null; if (np!==cur.poll){ cur={poll:np}; ok=''; if(tab==='poll') draw(); } }catch(x){} };
    const ev = new EventSource(RELAY + TV + '/sse?since=all');
    ev.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.event!=='message') return; const d=JSON.parse(m.message);
      if(d.k==='q'&&typeof d.qid==='string') Q[d.qid]={t:String(d.t).slice(0,220),time:m.time};
      else if(d.k==='u'&&typeof d.qid==='string'){ (U[d.qid] ||= new Set()); d.on===false?U[d.qid].delete(d.id):U[d.qid].add(d.id); } else return;
      if(tab==='qa' && !document.querySelector('#qt')?.value && document.activeElement?.id!=='qt') drawQA(B()); }catch(x){} };
  } catch(e){ st.textContent='Offline'; }
  draw();
}

(location.hash === '#host') ? host() : audience();
addEventListener('hashchange', ()=>location.reload());
}
</script>
</body>
