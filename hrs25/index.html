<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Culture · Erdo · HRS #25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: talk show santai tapi tajam; satu pembicara, Erdo.
   IDEA: ikut poster acara: biru royal, gelombang, judul amber huruf besar, ribbon Learning Fest.
   PICTURE: tanaman yang terus tumbuh vs pot yang mandek; angka hook raksasa; bar polling amber/putih.
   COLOUR and TYPE: biru #1f2f9e, navy #141f6e, amber #f7a823, putih, abu muda #eceef4; Poppins + Inter.
   LAYOUT: unit --u dari viewport. Landscape = komposisi 16:9, portrait/HP = ditumpuk dan bisa di-scroll. */
:root{--blue:#1f2f9e;--navy:#141f6e;--amber:#f7a823;--gold:#ffc23d;--coral:#f26b3a;--sky:#8fa2ff;--mint:#5fd3c4;
--white:#fff;--mist:#eceef4;--ink:#10173f;--mute:#5a6290;--hd:Poppins,system-ui,sans-serif;--bd:Inter,system-ui,sans-serif;
--u:min(calc(100vw / 1600),calc(100vh / 900));color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:16px/1.5 var(--bd);background:var(--blue);color:var(--white);overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

/* ---------- HOST ---------- */
#host{position:fixed;inset:0;background:var(--blue)}
.slide{position:absolute;inset:0;padding:calc(var(--u)*70) calc(var(--u)*96) calc(var(--u)*110);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:hidden;background:var(--blue);color:var(--white)}
.slide.on{opacity:1;pointer-events:auto}
.slide>*{position:relative;z-index:1}
.slide>.waves{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.slide.mist{background:var(--mist);color:var(--ink)}
.slide.amber{background:var(--amber);color:var(--ink)}
.kick{font:600 calc(var(--u)*20)/1.2 var(--hd);color:var(--amber);margin-bottom:calc(var(--u)*20);display:flex;align-items:center;gap:calc(var(--u)*12)}
.kick:before{content:"";width:calc(var(--u)*40);height:calc(var(--u)*4);background:currentColor;border-radius:4px}
.mist .kick{color:var(--blue)}.amber .kick{color:var(--navy)}
h1,h2,h3{font-family:var(--hd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:calc(var(--u)*84);line-height:1.02;font-weight:800;text-transform:uppercase;color:var(--amber)}
h2{font-size:calc(var(--u)*58);line-height:1.08;font-weight:700}
h3{font-size:calc(var(--u)*30);line-height:1.2;font-weight:700}
.lead{font-size:calc(var(--u)*27);line-height:1.45;max-width:calc(var(--u)*1100)}
.small{font-size:calc(var(--u)*17)}
.soft{opacity:.78}
.src{margin-top:auto;padding-top:calc(var(--u)*14);font-size:calc(var(--u)*15);opacity:.7}
.hl{color:var(--amber)}
.chrome{position:fixed;left:calc(var(--u)*96);right:calc(var(--u)*96);bottom:calc(var(--u)*28);display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*16);z-index:5;pointer-events:none}
.chrome>span{background:rgba(16,23,63,.85);color:#fff;padding:calc(var(--u)*8) calc(var(--u)*16);border-radius:99px;display:inline-flex;gap:calc(var(--u)*10);align-items:center;font-weight:600}
.prog{position:fixed;left:0;bottom:0;height:calc(var(--u)*7);background:var(--amber);transition:width .4s;z-index:5}
.dot{width:10px;height:10px;border-radius:50%;background:#999}
.dot.live{background:var(--mint);animation:pulse 1.8s infinite}.dot.err{background:var(--coral)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,196,.7)}70%{box-shadow:0 0 0 10px rgba(95,211,196,0)}}
.step{opacity:0;transform:translateY(calc(var(--u)*30));transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.step.shown{opacity:1;transform:none}

/* cover */
.ribbon{position:absolute;z-index:2;top:calc(var(--u)*70);right:calc(var(--u)*-150);transform:rotate(38deg);background:#c9ccd8;color:var(--blue);font:800 calc(var(--u)*34)/1 var(--hd);padding:calc(var(--u)*16) calc(var(--u)*170);white-space:nowrap}
.ribbon span{color:var(--amber)}
.cover{display:grid;grid-template-columns:1.25fr .75fr;gap:calc(var(--u)*40);height:100%}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:calc(var(--u)*18);font:800 calc(var(--u)*40)/1 var(--hd)}
.brand .tag{font:700 calc(var(--u)*18) var(--hd);background:var(--amber);color:var(--navy);padding:calc(var(--u)*6) calc(var(--u)*14);border-radius:99px}
.cover h1{margin:calc(var(--u)*26) 0 calc(var(--u)*14)}
.sub{font:500 calc(var(--u)*32)/1.2 var(--hd);padding-bottom:calc(var(--u)*16);border-bottom:calc(var(--u)*3) solid #fff;align-self:flex-start}
.meta{display:grid;grid-template-columns:auto auto;gap:calc(var(--u)*12) calc(var(--u)*60);margin-top:calc(var(--u)*30);align-self:flex-start}
.meta b{display:block;font:700 calc(var(--u)*34)/1.15 var(--hd);color:var(--amber)}
.meta span{font-size:calc(var(--u)*20);line-height:1.35;display:block}
.join{display:flex;gap:calc(var(--u)*24);align-items:center;margin-top:auto}
.qrw{background:#fff;padding:calc(var(--u)*10);border-radius:calc(var(--u)*12);flex:none}
.qrw canvas{display:block;width:calc(var(--u)*170);height:calc(var(--u)*170)}
.qrw.sm canvas{width:calc(var(--u)*190);height:calc(var(--u)*190)}
.join b{font:700 calc(var(--u)*28)/1.15 var(--hd);display:block}
.url{font:700 calc(var(--u)*22)/1.3 var(--hd);color:var(--amber);word-break:break-all}
.plants{width:100%;height:100%}
.stem{transform-origin:bottom center;animation:rise 2.4s cubic-bezier(.2,.8,.2,1) both}
.pop{transform-box:fill-box;transform-origin:left bottom;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0)}}

/* polls */
.pollgrid{display:grid;grid-template-columns:1fr calc(var(--u)*300);gap:calc(var(--u)*40);flex:1;min-height:0}
.pollq{font:700 calc(var(--u)*54)/1.1 var(--hd);text-wrap:balance}
.bars{margin-top:calc(var(--u)*34);display:flex;flex-direction:column;gap:calc(var(--u)*16)}
.bar{display:grid;grid-template-columns:calc(var(--u)*56) 1fr calc(var(--u)*130);align-items:center;gap:calc(var(--u)*18);font-size:calc(var(--u)*27)}
.bar .k{width:calc(var(--u)*52);height:calc(var(--u)*52);border-radius:calc(var(--u)*14);display:grid;place-items:center;font:700 calc(var(--u)*24) var(--hd);background:var(--c);color:var(--ink)}
.track{position:relative;height:calc(var(--u)*62);border-radius:calc(var(--u)*16);background:rgba(255,255,255,.12);overflow:hidden}
.mist .track{background:rgba(31,47,158,.08)}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);border-radius:calc(var(--u)*16);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lbl{position:absolute;left:calc(var(--u)*22);right:calc(var(--u)*14);top:50%;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#fff;mix-blend-mode:difference}
.mist .lbl{color:var(--ink);mix-blend-mode:normal}
.bar.top .lbl{font-weight:800}
.pct{text-align:right;font:700 calc(var(--u)*34) var(--hd)}
.pct small{display:block;font:500 calc(var(--u)*16) var(--bd);opacity:.7}
.manual .bar,.manual .col{cursor:pointer}.manual .track{outline:2px dashed var(--amber)}
.pollside{display:flex;flex-direction:column;gap:calc(var(--u)*14);align-items:center;text-align:center}
.count{font:800 calc(var(--u)*110)/1 var(--hd);color:var(--amber)}
.mist .count{color:var(--blue)}.amber .count{color:var(--navy)}
.reveal{position:absolute;left:calc(var(--u)*96);right:calc(var(--u)*96);bottom:calc(var(--u)*100);background:var(--amber);color:var(--navy);border-radius:calc(var(--u)*28);padding:calc(var(--u)*20) calc(var(--u)*40);box-shadow:0 20px 60px rgba(0,0,0,.35);z-index:3;display:grid;grid-template-columns:auto 1fr;column-gap:calc(var(--u)*40);align-items:center}
.reveal b{display:block;font:800 calc(var(--u)*130)/1 var(--hd);grid-row:span 2}
.reveal p{margin:0;font:600 calc(var(--u)*30)/1.3 var(--hd)}
.reveal small{display:block;margin-top:calc(var(--u)*10);font-size:calc(var(--u)*15);opacity:.75}
.scaleWrap{display:flex;gap:calc(var(--u)*24);align-items:flex-end;height:calc(var(--u)*360);margin-top:calc(var(--u)*24)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10);height:100%;justify-content:flex-end}
.colbar{width:100%;border-radius:calc(var(--u)*18) calc(var(--u)*18) 6px 6px;background:var(--c);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col b{font:700 calc(var(--u)*36) var(--hd)}.col span{font:700 calc(var(--u)*28) var(--hd)}
.avgbox{display:flex;align-items:baseline;gap:calc(var(--u)*16);margin-top:calc(var(--u)*18)}
.avg{font:800 calc(var(--u)*110)/1 var(--hd);color:var(--amber)}
.ends{display:flex;justify-content:space-between;gap:20px;font-size:calc(var(--u)*20);margin-top:calc(var(--u)*12)}
.wall{flex:1;display:flex;flex-wrap:wrap;gap:calc(var(--u)*14);align-content:flex-start;margin-top:calc(var(--u)*30);overflow:hidden}
.chip{padding:calc(var(--u)*14) calc(var(--u)*24);border-radius:99px;font:600 calc(var(--u)*25)/1.2 var(--hd);animation:pop .5s both;max-width:100%;background:var(--c);color:var(--ink)}

/* content */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*24);margin-top:calc(var(--u)*40);flex:1}
.fact{border-radius:calc(var(--u)*26);padding:calc(var(--u)*34);background:var(--c);color:var(--ink);display:flex;flex-direction:column;gap:calc(var(--u)*12)}
.fact .tagx{font:700 calc(var(--u)*16) var(--hd);text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.fact b{font:800 calc(var(--u)*100)/1 var(--hd)}
.fact p{margin:0;font-size:calc(var(--u)*24);line-height:1.38}
.fact small{margin-top:auto;font-size:calc(var(--u)*15);opacity:.72}
.timeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:calc(var(--u)*46);position:relative}
.timeline:before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*17);height:calc(var(--u)*4);background:rgba(255,255,255,.35);border-radius:4px}
.tl{position:relative;padding-top:calc(var(--u)*54);padding-right:calc(var(--u)*16)}
.tl:before{content:"";position:absolute;top:calc(var(--u)*3);left:0;width:calc(var(--u)*32);height:calc(var(--u)*32);border-radius:50%;background:var(--white);border:calc(var(--u)*6) solid var(--blue)}
.tl.now:before{background:var(--amber)}
.tl b{display:block;font:700 calc(var(--u)*24)/1.15 var(--hd)}
.tl span{font-size:calc(var(--u)*18);line-height:1.35;display:block;margin-top:calc(var(--u)*8);opacity:.82}
.comm{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*28);margin-top:auto}
.cbox{border-radius:calc(var(--u)*24);padding:calc(var(--u)*26) calc(var(--u)*32);display:flex;gap:calc(var(--u)*26);align-items:center;color:var(--ink)}
.cbox .big{font:800 calc(var(--u)*104)/1 var(--hd);flex:none}
.cbox>div:last-child{flex:1}
.cbox .yr{font:700 calc(var(--u)*19) var(--hd);display:inline-block;padding:calc(var(--u)*4) calc(var(--u)*14);border-radius:99px;background:rgba(16,23,63,.12);margin-bottom:calc(var(--u)*8)}
.cbox p{margin:0;font-size:calc(var(--u)*22);line-height:1.35}
.tgk{display:grid;grid-template-columns:1.1fr .9fr;gap:calc(var(--u)*44);margin-top:calc(var(--u)*28);flex:1;min-height:0}
.tgk>div:first-child{display:flex;flex-direction:column}
.metric{margin-bottom:calc(var(--u)*20)}
.metric h4{margin:0 0 calc(var(--u)*8);font:600 calc(var(--u)*21) var(--hd)}
.yb{display:grid;grid-template-columns:calc(var(--u)*70) 1fr calc(var(--u)*170);gap:calc(var(--u)*14);align-items:center;margin:calc(var(--u)*6) 0;font-size:calc(var(--u)*19)}
.yb i{display:block;height:calc(var(--u)*28);border-radius:calc(var(--u)*8);background:var(--c);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.on .yb i{width:var(--w)}
.yb em{font-style:normal;font-weight:700;text-align:right;white-space:nowrap}
.dose{background:var(--blue);color:#fff;border-radius:calc(var(--u)*28);padding:calc(var(--u)*36);display:flex;flex-direction:column;gap:calc(var(--u)*18);align-self:start}
.dose .q{font:800 calc(var(--u)*44)/1.12 var(--hd)}
.dose ul{margin:0;padding:0;list-style:none;font-size:calc(var(--u)*22);line-height:1.4}
.dose li{padding:calc(var(--u)*12) 0;border-top:1px solid rgba(255,255,255,.2)}
.dose li b{color:var(--amber)}
.grow2{display:grid;grid-template-columns:1.3fr 1fr;gap:calc(var(--u)*32);margin-top:calc(var(--u)*34);flex:1;min-height:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*18)}
.card{border-radius:calc(var(--u)*22);padding:calc(var(--u)*26);background:#fff;color:var(--ink);display:flex;flex-direction:column;gap:calc(var(--u)*10);border-top:calc(var(--u)*8) solid var(--c)}
.card h3{font-size:calc(var(--u)*26)}
.card p{margin:0;font-size:calc(var(--u)*19);line-height:1.4;color:var(--mute)}
.ritual{background:var(--amber);color:var(--ink);border-radius:calc(var(--u)*26);padding:calc(var(--u)*32);display:flex;flex-direction:column;gap:calc(var(--u)*12)}
.ritual h3{font-size:calc(var(--u)*34)}
.ritual ol{margin:0;padding-left:calc(var(--u)*28);font-size:calc(var(--u)*22);line-height:1.45}
.ritual .roles{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*14);font-size:calc(var(--u)*18);line-height:1.35}
.ritual .roles div{background:rgba(255,255,255,.55);border-radius:calc(var(--u)*14);padding:calc(var(--u)*14)}
.closing{display:grid;grid-template-columns:1fr calc(var(--u)*640);gap:calc(var(--u)*44);flex:1;min-height:0}
.quote{font:800 calc(var(--u)*64)/1.1 var(--hd);text-wrap:balance}
.qlist{display:flex;flex-direction:column;gap:calc(var(--u)*12);overflow:hidden}
.qi{display:grid;grid-template-columns:calc(var(--u)*70) 1fr calc(var(--u)*40);gap:calc(var(--u)*14);align-items:center;background:#fff;border-radius:calc(var(--u)*18);padding:calc(var(--u)*14) calc(var(--u)*18);color:var(--ink);border-left:calc(var(--u)*10) solid var(--c)}
.qi .v{font:800 calc(var(--u)*32) var(--hd);text-align:center;color:var(--blue)}
.qi .v small{display:block;font:500 calc(var(--u)*13) var(--bd);color:var(--mute)}
.qi p{margin:0;font-size:calc(var(--u)*21);line-height:1.35}
.qi button{border:0;background:transparent;font-size:calc(var(--u)*24);color:#a33;opacity:.4}
.qi.pin{outline:calc(var(--u)*4) solid var(--amber)}

@media (orientation:portrait),(max-width:700px){
  :root{--u:calc(100vw / 760)}
  .slide{overflow-y:auto;padding:calc(var(--u)*60) calc(var(--u)*44) calc(var(--u)*150)}
  h1{font-size:calc(var(--u)*68)}
  .ribbon{font-size:calc(var(--u)*24);top:calc(var(--u)*30)}
  .cover,.pollgrid,.tgk,.comm,.grow2,.closing{grid-template-columns:1fr}
  .cover{height:auto}.cover>div:last-child{height:calc(var(--u)*460)}
  .join{margin-top:calc(var(--u)*34)}
  .pollgrid,.tgk,.grow2,.closing,.facts,.cards{flex:none;align-content:start}
  .facts{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr 1fr;row-gap:calc(var(--u)*28)}.timeline:before{display:none}
  .comm{margin-top:calc(var(--u)*40)}
  .pollside{flex-direction:row;justify-content:space-between;order:-1}
  .pollq{font-size:calc(var(--u)*46)}
  .bar{grid-template-columns:calc(var(--u)*52) 1fr calc(var(--u)*110)}
  .lbl{white-space:normal;line-height:1.15}.track{height:calc(var(--u)*80)}
  .reveal{position:relative;left:auto;right:auto;bottom:auto;margin-top:calc(var(--u)*24);grid-template-columns:1fr}
  .reveal b{grid-row:auto}
  .chrome{left:calc(var(--u)*24);right:calc(var(--u)*24)}
}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,16,50,.92);display:grid;place-items:center;z-index:20;padding:16px}
.qrbig{background:#fff;color:var(--ink);border-radius:28px;padding:32px;text-align:center;max-width:92vw;border-top:14px solid var(--amber)}
.qrbig h2{font-size:clamp(24px,4vw,44px);margin-bottom:16px}
.qrbig canvas{width:min(68vh,80vw);height:min(68vh,80vw);margin:auto;display:block}
.qrbig .url{font-size:clamp(14px,2vw,24px);margin-top:12px;color:var(--blue)}
#notes{position:fixed;right:12px;bottom:12px;width:min(520px,92vw);max-height:60vh;overflow:auto;background:#fff8e6;color:#2a2a1f;border-radius:16px;padding:18px 22px;z-index:15;font-size:15px;line-height:1.5;box-shadow:0 20px 50px rgba(0,0,0,.4);border-top:8px solid var(--amber)}
#notes h4{margin:0 0 8px;font:700 17px var(--hd)}
#notes ul{padding-left:20px;margin:6px 0}
#help{position:fixed;right:12px;top:12px;z-index:15;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;max-width:92vw}
#help kbd{background:#fff;color:#000;border-radius:4px;padding:0 6px;font:600 12px var(--bd)}
.set{background:#fff;color:var(--ink);border-radius:20px;padding:26px;width:min(620px,92vw);display:flex;flex-direction:column;gap:12px}
.set label{font-weight:600}
.set input{font:16px var(--bd);padding:12px;border-radius:10px;border:1px solid #bbb;width:100%}
.btn{border:0;border-radius:12px;padding:12px 20px;min-height:44px;background:var(--blue);color:#fff;font-weight:600}
.btn.alt{background:#ddd;color:#222}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--amber);color:var(--ink);padding:10px 20px;border-radius:99px;font-weight:600;z-index:30}

/* ---------- AUDIENCE ---------- */
#aud{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:18px 18px 40px}
.atop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:#c9d0ff}
.abrand{font:800 18px var(--hd);color:#fff}.abrand span{color:var(--amber)}
.acard{background:#fff;color:var(--ink);border-radius:24px;padding:24px 20px;margin-top:18px}
.acard h2{font-size:23px;line-height:1.2;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid #dfe2ee;background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin-top:10px;min-height:56px;font-size:16px;transition:transform .15s}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;font:700 16px var(--hd);color:var(--ink);border:1px solid rgba(0,0,0,.1)}
.opt.sel{border-color:var(--blue);background:#eef0ff}
.scl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scl .opt{justify-content:center;font:700 22px var(--hd);padding:0}
.scl .opt.sel{background:var(--amber);border-color:var(--amber)}
.ends2{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:8px;gap:12px}
.ainput{width:100%;font:16px var(--bd);padding:14px;border-radius:14px;border:2px solid #dfe2ee;resize:vertical}
.abtn{margin-top:12px;width:100%;border:0;border-radius:14px;background:var(--amber);color:var(--ink);font-weight:700;min-height:52px;font-size:16px}
.abtn:disabled{opacity:.5}
.ok{margin-top:14px;font-size:14px;color:var(--blue);font-weight:600;min-height:20px}
.wait{text-align:center;padding:30px 10px}
.wait svg{width:120px;height:120px}
.aq{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #e6e8f2}
.aq p{margin:0;flex:1;font-size:15px}

  <g transform="translate(182 140)"><g class="pop" style="animation-delay:2.3s"><use href="#fl" fill="#f7a823"/><circle r="14" fill="#fff"/></g></g>
  <path d="M100 590 h164 l-18 96 h-128z" fill="#f7a823"/><rect x="92" y="578" width="180" height="26" rx="8" fill="#ffc23d"/>

   <li><b>Learning culture:</b> orang berani nanya, salah dibahas bareng, ilmu nyebar ke tim, cara kerja berubah Senin pagi</li></ul></div>

  notes:`<h4>Data publik + ceritamu</h4><ul><li>2020–2022: peserta 215 → 692 → 1.067; jam pelatihan 4.730 → 14.260 → 27.050; biaya Rp1,55 M → Rp1,80 M → Rp1,59 M.</li><li>Program: TrOli (training online saat pandemi), BLENDER (blended learning & gamification lewat aplikasi), 3D (menyiapkan penerus layer 2 dari layer 3).</li><li>Tekan → untuk memunculkan kotak "dosis". Di sini masuk ceritamu sendiri: apa yang bikin training benar-benar dipakai di lapangan, dan apa yang nggak. Ceritakan peranmu saja, jangan klaim program yang bukan kamu pegang.</li><li>Background farmasi: obat sebagus apa pun nggak ngefek kalau nggak diminum dan diserap.</li></ul>`},

/* ============ HOST ============ */
function host(){
  const root = document.getElementById('host'); root.classList.remove('hidden');
  let idx = Math.min(ls.get('hrs25-idx',0), S.length-1), stepN = 0, manual = false, showNotes = false;
  const V = {}; PID.forEach(p=>V[p]={});
  const M = ls.get('hrs25-manual', {}), R = ls.get('hrs25-reset', {});
  const hiddenQ = new Set(ls.get('hrs25-hiddenq', []));
  let pinQ = null; const Q = {}, U = {};

  root.innerHTML = S.map((s,i)=>`<section class="slide ${s.cls}" id="s${i}">${WAVES(s.cls==='mist'||s.cls==='amber')}${s.kick?`<div class="kick">${esc(s.kick)}</div>`:''}${body(s)}${s.extra?s.extra():''}</section>`).join('') +
    `<div class="chrome"><span><span class="dot" id="cdot"></span><span id="ctext">Menghubungkan…</span></span><span id="cpage"></span></div><div class="prog" id="prog"></div>`;
  root.querySelectorAll('[data-qr]').forEach(el=>qr(el,+el.dataset.qr));
  root.querySelectorAll('[data-url]').forEach(el=>el.textContent=joinUrl().replace(/^https?:\/\//,''));

  function side(p){ return `<div class="pollside"><div class="qrw sm"><div data-qr="240"></div></div><div><div class="count" data-count="${p}">0</div><div class="small soft">jawaban masuk</div></div></div>`; }
  function body(s){
    if (s.html) return s.html();
    if (s.qa) return `<div class="closing"><div style="display:flex;flex-direction:column"><div class="quote">Learning culture itu kelihatan di <span class="hl">Senin pagi</span>, bukan di sertifikat.</div>
      <div class="lead" style="margin-top:calc(var(--u)*30)">Terima kasih. Lanjut ngobrol dan belajar bareng di <b>OD.ID</b> (orgdev.id) dan <b>Circle HR ITB</b>.</div>
      <div class="join" style="margin-top:auto"><div class="qrw"><div data-qr="220"></div></div><div><b>Kirim pertanyaan dari HP</b><div class="small soft">Vote juga pertanyaan orang lain</div></div></div></div>
      <div class="qlist" id="qlist"></div></div>`;
    const P = POLLS[s.poll]; let inner;
    if (P.type==='choice') inner = `<div class="bars" data-bars="${s.poll}">${P.opts.map((o,i)=>`<div class="bar" data-i="${i}" style="--c:${C[i]}"><div class="k">${L[i]}</div><div class="track"><div class="fill"></div><div class="lbl">${esc(o)}</div></div><div class="pct">0%<small>0</small></div></div>`).join('')}</div>`;
    else if (P.type==='scale') inner = `<div class="avgbox"><div class="avg" data-avg="${s.poll}">–</div><div class="lead soft">rata-rata dari 5</div></div>
      <div class="scaleWrap" data-scale="${s.poll}">${P.opts.map((o,i)=>`<div class="col" data-i="${i}" style="--c:${SC[i]}"><b>0</b><div class="colbar"></div><span>${o}</span></div>`).join('')}</div><div class="ends"><span>1 = ${esc(P.lo)}</span><span style="text-align:right">5 = ${esc(P.hi)}</span></div>`;
    else inner = `<div class="wall" data-wall="${s.poll}"></div>`;
    return `<div class="pollgrid"><div style="display:flex;flex-direction:column;min-height:0"><div class="pollq">${esc(P.q)}</div>${inner}</div>${side(s.poll)}</div>`;
  }

  function tally(p){
    const P = POLLS[p], n = P.opts ? P.opts.length : 0, c = new Array(n).fill(0), list = [];
    for (const v of Object.values(V[p])) { if (v.t < (R[p]||0)) continue; if (P.type==='text') list.push(v); else if (v.a>=0 && v.a<n) c[v.a]++; }
    (M[p]||[]).forEach((m,i)=>{ if(i<n) c[i]+=m||0; });
    return {c, list, total: P.type==='text' ? list.length : c.reduce((a,b)=>a+b,0)};
  }
  function renderPoll(p){
    const {c,list,total} = tally(p), max = Math.max(...c, 0);
    root.querySelectorAll(`[data-count="${p}"]`).forEach(e=>e.textContent=total);
    root.querySelectorAll(`[data-bars="${p}"] .bar`).forEach(b=>{const i=+b.dataset.i, pc= total? Math.round(c[i]/total*100):0;
      b.querySelector('.fill').style.width = pc+'%'; b.querySelector('.pct').innerHTML = `${pc}%<small>${c[i]} orang</small>`; b.classList.toggle('top', max>0 && c[i]===max);});
    root.querySelectorAll(`[data-scale="${p}"] .col`).forEach(b=>{const i=+b.dataset.i; b.querySelector('.colbar').style.height = (max? c[i]/max*75:0)+'%'; b.querySelector('b').textContent=c[i];});
    root.querySelectorAll(`[data-avg="${p}"]`).forEach(e=>{const s=c.reduce((a,v,i)=>a+v*(i+1),0); e.textContent = total ? (s/total).toFixed(1).replace('.',',') : '–';});
    root.querySelectorAll(`[data-wall="${p}"]`).forEach(w=>{ const items = list.sort((a,b)=>b.t-a.t).slice(0,40);
      const key = items.map(x=>x.t+x.a).join('|'); if (w.dataset.key===key) return; w.dataset.key=key; w.innerHTML='';
      items.forEach((x,i)=>{const d=document.createElement('div');d.className='chip';d.style.setProperty('--c',['#ffffff','#1f2f9e','#f26b3a','#5fd3c4','#8fa2ff'][i%5]);if(i%5===1)d.style.color='#fff';d.textContent=x.a;w.appendChild(d)}); });
  }
  function renderQA(){
    const el = document.getElementById('qlist'); if(!el) return;
    const qs = Object.entries(Q).filter(([id])=>!hiddenQ.has(id)).map(([id,q])=>({id,...q,n:(U[id]?U[id].size:0)})).sort((a,b)=>b.n-a.n||a.time-b.time).slice(0,6);
    el.innerHTML = qs.length ? '' : '<div class="lead soft">Belum ada pertanyaan. Scan QR dan kirim dari HP kamu.</div>';
    qs.forEach((q,i)=>{const d=document.createElement('div');d.className='qi'+(pinQ===q.id?' pin':'');d.style.setProperty('--c',['#f7a823','#8fa2ff','#f26b3a','#5fd3c4'][i%4]);
      d.innerHTML=`<div class="v">${q.n}<small>vote</small></div><p></p><button title="Sembunyikan" aria-label="Sembunyikan">×</button>`;
      d.querySelector('p').textContent=q.t; d.onclick=()=>{pinQ = pinQ===q.id?null:q.id; renderQA();};
      d.querySelector('button').onclick=e=>{e.stopPropagation();hiddenQ.add(q.id);ls.set('hrs25-hiddenq',[...hiddenQ]);renderQA();};
      el.appendChild(d);});
  }
  let raf=0; const renderAll=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; PID.forEach(renderPoll); renderQA();}); };

  function ingest(d, t){
    if (!d || typeof d!=='object' || typeof d.id!=='string') return;
    if ((d.k==='v'||d.k==='w') && V[d.p]) { const prev=V[d.p][d.id]; if(!prev||prev.t<=t) V[d.p][d.id] = {a: d.k==='w'? String(d.a).slice(0,60) : +d.a, t}; }
    else if (d.k==='q' && typeof d.qid==='string') { Q[d.qid] = {t:String(d.t).slice(0,220), time:t}; }
    else if (d.k==='u' && typeof d.qid==='string') { (U[d.qid] ||= new Set()); d.on===false ? U[d.qid].delete(d.id) : U[d.qid].add(d.id); }
    renderAll();
  }
  function setConn(s){ const dot=document.getElementById('cdot'), t=document.getElementById('ctext');
    dot.className='dot '+(s==='live'?'live':s==='err'?'err':''); t.textContent = s==='live' ? 'Live voting aktif' : s==='err' ? 'Offline · tally manual (M)' : 'Menghubungkan…'; }
  try {
    const es = new EventSource(RELAY + TV + '/sse?since=all');
    es.onopen = ()=>setConn('live'); es.onerror = ()=>setConn('err');
    es.onmessage = e => { try { const m=JSON.parse(e.data); if (m.event!=='message') return; ingest(JSON.parse(m.message), m.time); } catch(x){} };
  } catch(e){ setConn('err'); }

  let pubT=0;
  function publish(){ clearTimeout(pubT); pubT=setTimeout(()=>{ const s=S[idx];
    fetch(RELAY+TS,{method:'POST',body:JSON.stringify({slide:idx,poll:s.poll||null,qa:!!s.qa})}).catch(()=>{}); },500); }

  const stepsOf = i => [...document.getElementById('s'+i).querySelectorAll('.step')];
  function showSteps(){ stepsOf(idx).forEach((el,j)=>el.classList.toggle('shown', j<stepN)); }
  function go(i, atEnd){
    idx = Math.max(0, Math.min(S.length-1, i)); ls.set('hrs25-idx', idx);
    stepN = atEnd ? stepsOf(idx).length : 0;
    root.querySelectorAll('.slide').forEach((el,j)=>{ el.classList.toggle('on', j===idx); if(j===idx) el.scrollTop=0; });
    showSteps();
    document.getElementById('prog').style.width = ((idx+1)/S.length*100)+'%';
    document.getElementById('cpage').textContent = `${idx+1} / ${S.length}`;
    root.classList.toggle('manual', manual);
    renderNotes(); renderAll(); publish();
  }
  function next(){ if (stepN < stepsOf(idx).length){ stepN++; showSteps(); } else go(idx+1); }
  function prev(){ if (stepN > 0){ stepN--; showSteps(); } else go(idx-1, true); }

  const notesEl = document.createElement('div'); notesEl.id='notes'; notesEl.className='hidden'; document.body.appendChild(notesEl);
  function renderNotes(){ notesEl.classList.toggle('hidden', !showNotes); notesEl.innerHTML = `<div class="soft" style="font-size:12px;margin-bottom:6px">Catatan pembicara · slide ${idx+1}</div>` + (S[idx].notes||'Tidak ada catatan.'); }
  const help = document.createElement('div'); help.id='help';
  help.innerHTML = `<kbd>→</kbd> <kbd>←</kbd> pindah / munculkan · <kbd>N</kbd> catatan · <kbd>Q</kbd> QR besar · <kbd>F</kbd> layar penuh<br><kbd>M</kbd> tally manual (klik opsi +1, Shift+klik −1) · <kbd>R</kbd> reset polling · <kbd>S</kbd> setelan · <kbd>H</kbd> bantuan`;
  document.body.appendChild(help); setTimeout(()=>help.classList.add('hidden'),12000);

  function overlay(html, onMount){ const o=document.createElement('div'); o.className='ov'; o.innerHTML=html; o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); onMount&&onMount(o); return o; }
  function bigQR(){ overlay(`<div class="qrbig"><h2>Scan untuk ikut voting</h2><div data-qr="640"></div><div class="url"></div></div>`, o=>{ qr(o.querySelector('[data-qr]'),640); o.querySelector('.url').textContent=joinUrl(); }); }
  function settings(){ overlay(`<form class="set"><h3 style="font-size:24px">Setelan</h3>
    <label for="ju">URL untuk audiens (yang masuk ke QR)</label><input id="ju" type="url" placeholder="https://…">
    <div class="soft" style="font-size:14px">Kosongkan untuk memakai alamat halaman ini. Room relay: ${esc(ROOM)}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn alt" id="rs">Reset semua polling</button><button class="btn">Simpan</button></div></form>`, o=>{
      const f=o.querySelector('form'), inp=o.querySelector('#ju'); inp.value=ls.get('hrs25-join','');
      f.onsubmit=e=>{e.preventDefault(); ls.set('hrs25-join', inp.value.trim()); location.reload();};
      o.querySelector('#rs').onclick=()=>{ const now=Date.now()/1000; PID.forEach(p=>{R[p]=now;M[p]=[]}); ls.set('hrs25-reset',R); ls.set('hrs25-manual',M); toast('Semua polling di-reset'); o.remove(); renderAll(); };
    }); }
  function confirmReset(p){ overlay(`<div class="set"><h3 style="font-size:22px">Reset polling ini?</h3><div>Jawaban sebelumnya diabaikan, audiens bisa vote ulang.</div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn alt" id="no">Batal</button><button class="btn" id="yes">Reset</button></div></div>`, o=>{
    o.querySelector('#no').onclick=()=>o.remove(); o.querySelector('#yes').onclick=()=>{R[p]=Date.now()/1000; M[p]=[]; ls.set('hrs25-reset',R); ls.set('hrs25-manual',M); o.remove(); renderAll(); toast('Polling di-reset');}; }); }

  root.addEventListener('click', e=>{
    const b = e.target.closest('.bar,.col'); if (!manual || !b) return;
    const p = S[idx].poll; if(!p) return; const i=+b.dataset.i; M[p] ||= []; M[p][i] = Math.max(0,(M[p][i]||0) + (e.shiftKey?-1:1)); ls.set('hrs25-manual',M); renderAll();
  });
  document.addEventListener('keydown', e=>{
    if (e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (['arrowright','pagedown',' ','enter'].includes(k)) { e.preventDefault(); next(); }
    else if (['arrowleft','pageup','backspace'].includes(k)) { e.preventDefault(); prev(); }
    else if (k==='home') go(0); else if (k==='end') go(S.length-1);
    else if (k==='n') { showNotes=!showNotes; renderNotes(); }
    else if (k==='h') help.classList.toggle('hidden');
    else if (k==='m') { manual=!manual; root.classList.toggle('manual',manual); toast(manual?'Tally manual ON: klik opsi untuk +1':'Tally manual OFF'); }
    else if (k==='r' && S[idx].poll) confirmReset(S[idx].poll);
    else if (k==='q') { const o=document.querySelector('.ov'); o?o.remove():bigQR(); }
    else if (k==='s') settings();
    else if (k==='escape') document.querySelector('.ov')?.remove();
    else if (k==='f') { try{ document.fullscreenElement? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(x){} }
  });
  let tx=0, ty=0; root.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  root.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) (dx<0?next:prev)();});
  setConn('off'); go(idx);
  setInterval(publish, 20000);
}

/* ============ AUDIENCE ============ */
function audience(){
  const root = document.getElementById('aud'); root.classList.remove('hidden');
  let me = ls.get('hrs25-me',''); if(!me){ me = Math.random().toString(36).slice(2)+Date.now().toString(36); ls.set('hrs25-me',me); }
  const mine = ls.get('hrs25-mine',{}), myUps = new Set(ls.get('hrs25-ups',[]));
  let cur = {poll:null}, tab='poll', busy=false, ok='';
  const Q = {}, U = {};
  root.innerHTML = `<div class="atop"><span class="abrand">hrstories <span>#25</span> · Learning Culture</span><span id="ast">Menghubungkan…</span></div>
    <div class="tabs"><button data-t="poll" class="on">Voting</button><button data-t="qa">Tanya Erdo</button></div><div id="abody"></div>`;
  root.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; ok=''; root.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); draw();});
  const B = ()=>document.getElementById('abody');

  async function send(body){
    if (busy) return; busy=true; draw();
    try { const r = await post(body); if(!r.ok) throw 0; ok='Tercatat. Lihat hasilnya di layar.'; }
    catch(e){ ok='Gagal terkirim, coba lagi sebentar.'; }
    setTimeout(()=>{busy=false; draw();}, 1200); draw();
  }
  function draw(){
    const b = B();
    if (tab==='qa') return drawQA(b);
    const p = cur.poll, P = POLLS[p];
    if (!P) { b.innerHTML = `<div class="acard wait"><svg viewBox="0 0 120 120"><rect x="56" y="40" width="8" height="50" rx="4" fill="#5fd3c4"/><path d="M60 60 C70 44 92 44 98 54 C86 62 70 64 60 60Z" fill="#5fd3c4"/><path d="M60 72 C50 56 28 56 22 66 C34 74 50 76 60 72Z" fill="#8fa2ff"/><circle cx="60" cy="34" r="10" fill="#f7a823"/><path d="M34 90h52l-6 26H40z" fill="#f7a823"/></svg>
      <h2>Dengerin dulu, ya</h2><p style="color:var(--mute)">Pertanyaan voting muncul di sini otomatis begitu dibuka. Sambil nunggu, kamu bisa kirim pertanyaan di tab "Tanya Erdo".</p></div>`; return; }
    let html = `<div class="acard"><h2></h2>`;
    if (P.type==='choice') html += P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" style="--c:${C[i]}" ${busy?'disabled':''}><span class="k">${L[i]}</span><span></span></button>`).join('');
    else if (P.type==='scale') html += `<div class="scl">${P.opts.map((o,i)=>`<button class="opt ${mine[p]===i?'sel':''}" data-i="${i}" ${busy?'disabled':''}>${o}</button>`).join('')}</div><div class="ends2"><span>1 = ${esc(P.lo)}</span><span style="text-align:right">5 = ${esc(P.hi)}</span></div>`;
    else html += `<input class="ainput" id="wt" maxlength="60" placeholder="Contoh: retro 30 menit tiap Jumat" value="${esc(mine[p]||'')}"><button class="abtn" id="ws" ${busy?'disabled':''}>Kirim</button>`;
    html += `<div class="ok">${esc(ok)}</div></div>`;
    b.innerHTML = html; b.querySelector('h2').textContent = P.q;
    if (P.opts) b.querySelectorAll('.opt').forEach(o=>{ const i=+o.dataset.i; if(P.type==='choice') o.querySelector('span:last-child').textContent=P.opts[i];
      o.onclick=()=>{ mine[p]=i; ls.set('hrs25-mine',mine); send({k:'v',p,a:i,id:me}); }; });
    else { const inp=b.querySelector('#wt'); b.querySelector('#ws').onclick=()=>{ const v=inp.value.trim(); if(!v) return; mine[p]=v; ls.set('hrs25-mine',mine); send({k:'w',p,a:v,id:me}); }; }
  }
  function drawQA(b){
    const qs = Object.entries(Q).map(([id,q])=>({id,...q,n:U[id]?U[id].size:0})).sort((a,b)=>b.n-a.n||b.time-a.time).slice(0,30);
    b.innerHTML = `<div class="acard"><h2>Mau tanya apa ke Erdo?</h2><textarea class="ainput" id="qt" rows="3" maxlength="220" placeholder="Tulis pertanyaanmu…"></textarea><button class="abtn" id="qs" ${busy?'disabled':''}>Kirim pertanyaan</button><div class="ok">${esc(ok)}</div></div>
      <div class="acard"><h2 style="font-size:19px">Vote pertanyaan yang kamu mau dibahas</h2><div id="ql">${qs.length?'':'<p style="color:var(--mute)">Belum ada pertanyaan.</p>'}</div></div>`;
    const ql = b.querySelector('#ql');
    qs.forEach(q=>{ const d=document.createElement('div'); d.className='aq'; d.innerHTML=`<p></p><button class="up ${myUps.has(q.id)?'on':''}">+${q.n}</button>`; d.querySelector('p').textContent=q.t;
      d.querySelector('button').onclick=()=>{ const on=!myUps.has(q.id); on?myUps.add(q.id):myUps.delete(q.id); ls.set('hrs25-ups',[...myUps]);
        (U[q.id] ||= new Set()); on?U[q.id].add(me):U[q.id].delete(me); post({k:'u',qid:q.id,on,id:me}).catch(()=>{}); drawQA(b); };
      ql.appendChild(d); });
    b.querySelector('#qs').onclick=()=>{ const t=b.querySelector('#qt').value.trim(); if(!t) return; const qid=Math.random().toString(36).slice(2,10); send({k:'q',qid,t,id:me}); };
  }
  const st = document.getElementById('ast');
  try {
    const es = new EventSource(RELAY + TS + '/sse?since=30m');
    es.onopen=()=>st.textContent='Terhubung'; es.onerror=()=>st.textContent='Menyambung ulang…';
    es.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.event!=='message') return; const d=JSON.parse(m.message);
      const np = POLLS[d.poll] ? d.poll : null; if (np!==cur.poll){ cur={poll:np}; ok=''; if(tab==='poll') draw(); } }catch(x){} };
    const ev = new EventSource(RELAY + TV + '/sse?since=all');
    ev.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.event!=='message') return; const d=JSON.parse(m.message);
      if(d.k==='q'&&typeof d.qid==='string') Q[d.qid]={t:String(d.t).slice(0,220),time:m.time};
      else if(d.k==='u'&&typeof d.qid==='string'){ (U[d.qid] ||= new Set()); d.on===false?U[d.qid].delete(d.id):U[d.qid].add(d.id); } else return;
      if(tab==='qa' && !document.querySelector('#qt')?.value && document.activeElement?.id!=='qt') drawQA(B()); }catch(x){} };
  } catch(e){ st.textContent='Offline'; }
  draw();
}

(location.hash === '#host') ? host() : audience();
addEventListener('hashchange', ()=>location.reload());
}
</script>
